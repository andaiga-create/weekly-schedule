<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AS & CLAIM 주간 스케줄 (2026)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 40px;
            border-bottom: 4px solid #ffd700;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 40px;
            border-bottom: 4px solid #ffd700;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .filters {
            background: #f8f9fa;
            padding: 25px 40px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 10px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group select:hover {
            border-color: #667eea;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 카드보기 / 전체보기 토글 버튼 */
        .view-toggle {
            display: flex;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            height: 42px;
        }

        .view-btn {
            flex: 1;
            padding: 0 18px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .view-btn + .view-btn {
            border-left: 2px solid #dee2e6;
        }

        .view-btn:hover {
            background: #f1f3f5;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* 항상 화면에 떠 있는 전주/차주 네비게이션 */
        .floating-week-nav {
            position: fixed;
            right: 30px;
            bottom: 30px;
            /* iOS Safari 하단 툴바에 가려지지 않도록 safe-area 보정 */
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 2147483647;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .float-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 64px;
            padding: 12px 8px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .float-nav-btn .arrow {
            font-size: 16px;
            line-height: 1;
        }

        .float-nav-btn:hover {
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
            transform: translateY(-2px);
        }

        .float-nav-btn:active {
            transform: translateY(0);
        }

        .float-today-btn {
            background: linear-gradient(135deg, #ffb300 0%, #ff8f00 100%);
        }

        .float-today-btn:hover {
            box-shadow: 0 4px 14px rgba(255, 143, 0, 0.5);
        }

        /* 오늘 버튼 안에 표시되는 현재 선택 주차 텍스트 (기존 별도 라벨을 버튼에 통합) */
        .float-today-week {
            font-size: 10px;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.95);
            margin-top: 1px;
            padding-top: 3px;
            width: 100%;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
        }

        /* 전체보기 → 카드보기(특정 스케줄) 이동 후, 원래 보던 전체보기로 되돌아가는 버튼 */
        .return-to-overview-btn {
            position: fixed;
            left: 30px;
            bottom: 30px;
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            display: none;
            align-items: center;
            gap: 8px;
            padding: 14px 18px;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            white-space: nowrap;
            z-index: 2147483647;
            transition: all 0.2s ease;
        }

        .return-to-overview-btn.show {
            display: flex;
        }

        .return-to-overview-btn:hover {
            box-shadow: 0 4px 14px rgba(30, 60, 114, 0.5);
            transform: translateY(-2px);
        }

        .return-to-overview-btn .arrow {
            font-size: 16px;
            line-height: 1;
        }

        @media (max-width: 768px) {
            .return-to-overview-btn {
                left: 16px;
                bottom: 16px;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                padding: 12px 16px;
                font-size: 13px;
            }
        }

        /* 전주/차주 경계 도달 시 표시되는 알림 토스트 */
        .week-toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(33, 37, 41, 0.92);
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 2147483647;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .week-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .week-toast {
                bottom: 90px;
                font-size: 13px;
                padding: 10px 16px;
                max-width: 80vw;
                white-space: normal;
                text-align: center;
            }

            .floating-week-nav {
                right: 16px;
                bottom: 16px;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                padding: 8px;
            }

            .float-nav-btn {
                width: 54px;
                padding: 10px 6px;
                font-size: 11px;
            }

            .float-today-week {
                font-size: 9px;
            }
        }

        .stats {
            background: white;
            padding: 20px 40px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.total {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .stat-icon.week {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .stat-text {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            font-weight: 500;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #212529;
        }

        .content {
            padding: 40px;
        }

        .week-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .week-title {
            font-size: 24px;
            font-weight: 700;
        }

        .week-range {
            font-size: 14px;
            opacity: 0.9;
        }

        .schedule-grid {
            display: grid;
            gap: 20px;
        }

        .schedule-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .schedule-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }

        .schedule-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        /* 전체보기에서 선택한 스케줄이 카드보기로 넘어왔을 때 강조 표시 */
        .schedule-card.highlighted {
            border-color: #ffd700;
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.35), 0 8px 24px rgba(102, 126, 234, 0.25);
            animation: highlightPulse 1.4s ease-in-out 2;
        }

        @keyframes highlightPulse {
            0%, 100% { box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.35), 0 8px 24px rgba(102, 126, 234, 0.25); }
            50% { box-shadow: 0 0 0 8px rgba(255, 215, 0, 0.15), 0 8px 24px rgba(102, 126, 234, 0.25); }
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e9ecef;
        }

        .card-date {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-main {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
        }

        .date-week {
            font-size: 12px;
            color: #6c757d;
            font-weight: 500;
        }

        .card-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.as {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge.claim {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge.naeso {
            background: #fff8e1;
            color: #f9a825;
        }

        .badge.default {
            background: #eceff1;
            color: #455a64;
        }

        .badge.free {
            background: #e8f5e9;
            color: #388e3c;
        }

        .badge.paid {
            background: #fff3e0;
            color: #f57c00;
        }

        .card-body {
            display: grid;
            gap: 16px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            align-items: start;
        }

        .info-label {
            font-size: 13px;
            font-weight: 600;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-label::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #667eea;
            border-radius: 50%;
        }

        .info-value {
            font-size: 14px;
            color: #212529;
            line-height: 1.6;
        }

        .info-value.highlight {
            font-weight: 600;
            color: #667eea;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .no-data-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-data-text {
            font-size: 18px;
            font-weight: 500;
        }

        /* ===== 주간 전체보기 (가로 보드) ===== */
        .overview-board {
            display: flex;
            gap: 12px;
            align-items: stretch;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .overview-day {
            flex: 1 1 0;
            min-width: 150px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .overview-day.today {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .overview-day-header {
            padding: 10px 8px;
            text-align: center;
            background: white;
            border-bottom: 2px solid #e9ecef;
        }

        .overview-day.today .overview-day-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .overview-day-date {
            font-size: 15px;
            font-weight: 700;
            color: #212529;
        }

        .overview-day.today .overview-day-date {
            color: white;
        }

        .overview-day-weekday {
            font-size: 12px;
            color: #868e96;
            margin-left: 4px;
        }

        .overview-day.today .overview-day-weekday {
            color: rgba(255, 255, 255, 0.85);
        }

        .overview-day.weekend .overview-day-date,
        .overview-day.weekend .overview-day-weekday {
            color: #e03131;
        }

        .overview-day.today.weekend .overview-day-date,
        .overview-day.today.weekend .overview-day-weekday {
            color: white;
        }

        .overview-day-count {
            font-size: 11px;
            color: #667eea;
            font-weight: 700;
            margin-top: 2px;
        }

        .overview-day.today .overview-day-count {
            color: rgba(255, 255, 255, 0.9);
        }

        .overview-day-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* 하루 일정이 많아도 보드 전체 높이는 일정하게 유지하고,
               해당 요일 칸 안에서만 스크롤되게 하여 화면 전체 스크롤을 최소화 */
            max-height: 560px;
            overflow-y: auto;
        }

        .overview-empty {
            text-align: center;
            color: #adb5bd;
            font-size: 12px;
            padding: 24px 4px;
        }

        .overview-item {
            background: white;
            border: 1px solid #e9ecef;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .overview-item:hover {
            border-color: #667eea;
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.25);
            transform: translateY(-2px);
        }

        .overview-item:active {
            transform: translateY(0);
        }

        .overview-item.claim {
            border-left-color: #7b1fa2;
        }

        .overview-item.naeso {
            border-left-color: #f9a825;
        }

        .overview-item-top {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .overview-item .badge {
            padding: 3px 7px;
            font-size: 10px;
        }

        .overview-item-place {
            font-weight: 700;
            color: #212529;
            margin-bottom: 2px;
        }

        .overview-item-sub {
            color: #6c757d;
            margin-bottom: 6px;
        }

        /* 외주 정보를 한눈에 들어오도록 강조 배지 처리 */
        .overview-vendor {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #fff8e1;
            color: #e65100;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 4px;
            max-width: 100%;
        }

        .overview-item-manager {
            color: #495057;
            font-size: 11px;
        }

        .overview-item-vehicle {
            color: #1e6f5c;
            font-size: 11px;
            margin-top: 2px;
        }

        @media (max-width: 768px) {
            .overview-board {
                gap: 8px;
            }

            .overview-day {
                min-width: 130px;
            }

            .overview-day-body {
                max-height: 420px;
            }
        }

        /* ===== 주간 전체보기 상단 미니바 (기본은 숨김) ===== */
        .overview-topbar {
            display: none;
            position: sticky;
            top: 0;
            z-index: 50;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: white;
            padding: 10px 16px;
            border-bottom: 2px solid #e9ecef;
        }

        .ob-exit-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #eceff1;
            color: #37474f;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .ob-exit-btn:hover {
            background: #dfe3e6;
        }

        .ob-week-label {
            font-weight: 700;
            font-size: 14px;
            color: #212529;
            text-align: center;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ob-nav {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .ob-nav-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .ob-nav-btn:hover {
            opacity: 0.85;
        }

        /* 주간 전체보기 활성화 시: 헤더/필터/통계/주차타이틀 등 메뉴 전부 숨기고
           일정 보드가 화면을 꽉 채우도록 전환 */
        body.overview-fullscreen {
            padding: 0;
        }

        body.overview-fullscreen .container {
            max-width: 100%;
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.overview-fullscreen .header,
        body.overview-fullscreen .filters,
        body.overview-fullscreen .stats,
        body.overview-fullscreen .week-header {
            display: none !important;
        }

        body.overview-fullscreen .overview-topbar {
            display: flex;
        }

        body.overview-fullscreen .content {
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        body.overview-fullscreen #scheduleGrid {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        body.overview-fullscreen .overview-board {
            flex: 1;
            min-height: 0;
            height: auto;
        }

        body.overview-fullscreen .overview-day {
            height: 100%;
        }

        body.overview-fullscreen .overview-day-body {
            flex: 1;
            min-height: 0;
            max-height: none;
        }

        /* 전체보기에서는 상단바에 이미 전주/차주 버튼이 있으므로
           화면을 가리는 플로팅 버튼은 숨김 */
        body.overview-fullscreen .floating-week-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .overview-topbar {
                padding: 8px 10px;
            }

            .ob-exit-btn {
                padding: 7px 10px;
                font-size: 12px;
            }

            .ob-week-label {
                font-size: 12px;
            }

            .ob-nav-btn {
                padding: 7px 9px;
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group select {
                min-width: 100%;
            }

            .view-toggle {
                width: 100%;
            }

            .stats {
                gap: 20px;
                padding: 16px 18px;
            }

            .stat-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .stat-value {
                font-size: 20px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .header h1 {
                font-size: clamp(18px, 5.6vw, 22px);
                white-space: nowrap;
                letter-spacing: -0.4px;
            }

            .header {
                padding: 14px 16px;
            }
        }

        @keyframes highlight {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
                transform: translateY(0);
            }
            50% {
                box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
                transform: translateY(-4px);
            }
        }


        /* ===== A/S 레포트 (카드 하단 줄 · 등록 · 작성 · 고객확인 · 미리보기) ===== */
        :root {
            --rp-bg: #f1f3f9; --rp-surface: #ffffff; --rp-ink: #212529; --rp-muted: #6c757d;
            --rp-line: #dee2e6; --rp-soft: #eef1fb; --rp-accent: #4c5fd0; --rp-accent-ink: #ffffff;
        }

        .rp-row {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
            margin: 20px -24px -24px; padding: 10px 16px 10px 24px;
            border-top: 1px solid #e9ecef; background: #f8f9fa;
        }
        .rp-label { font-size: 12px; font-weight: 700; color: #6c757d; letter-spacing: 0.5px; }
        .rp-pill { font-size: 11.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; background: white; }
        .rp-pill.none { color: #6c757d; } .rp-pill.reg { color: #1976d2; } .rp-pill.draft { color: #b7791f; }
        .rp-pill.await { color: #f57c00; } .rp-pill.done { color: #388e3c; }
        .rp-acts { display: flex; gap: 6px; margin-left: auto; }
        @media (max-width: 480px) { .rp-row { gap: 6px; } .rp-btn { padding: 0 11px; min-height: 38px; } }
        .rp-btn {
            min-height: 36px; padding: 0 14px; border: 1px solid #ced4da; border-radius: 8px;
            background: white; color: #343a40; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
        }
        .rp-btn.pri { background: var(--rp-accent); border-color: var(--rp-accent); color: #fff; }
        .rp-btn:focus-visible, .rp-big:focus-visible, .rp-seg button:focus-visible { outline: 2px solid var(--rp-accent); outline-offset: 2px; }

        body.rp-open { overflow: hidden; }
        body.rp-open .floating-week-nav, body.rp-open .return-to-overview-btn, body.rp-open .week-toast { display: none; }

        .rp-sheet {
            position: fixed; inset: 0; z-index: 2147483647; background: var(--rp-bg); color: var(--rp-ink);
            display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px);
            font-size: 15px; line-height: 1.5;
        }
        .rp-sheet[hidden] { display: none !important; }
        .rp-sheet * { box-sizing: border-box; }
        .rp-head {
            display: flex; align-items: center; gap: 10px; background: var(--rp-surface); border-bottom: 1px solid var(--rp-line);
            padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
        }
        .rp-head h2 { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .rp-x { min-width: 44px; min-height: 44px; background: none; border: 0; font: inherit; font-size: 15px; color: var(--rp-muted); cursor: pointer; }
        .rp-main { flex: 1; overflow-y: auto; padding: 16px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
        .rp-in { max-width: 620px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
        .rp-foot {
            display: flex; gap: 10px; background: var(--rp-surface); border-top: 1px solid var(--rp-line);
            padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
        }
        .rp-big { flex: 1; min-height: 50px; border-radius: 10px; border: 1px solid var(--rp-line); background: var(--rp-surface); font: inherit; font-weight: 700; font-size: 16px; color: var(--rp-ink); cursor: pointer; }
        .rp-big.pri { background: var(--rp-accent); border-color: var(--rp-accent); color: #fff; }
        .rp-big:disabled { opacity: 0.45; }
        .rp-field { display: flex; flex-direction: column; gap: 5px; }
        .rp-field label, .rp-lab { font-size: 13px; font-weight: 600; color: var(--rp-muted); }
        .rp-field label small { font-weight: 400; margin-left: 6px; }
        .rp-field input, .rp-field textarea {
            width: 100%; font: inherit; font-size: 16px; color: var(--rp-ink); background: var(--rp-surface);
            border: 1px solid var(--rp-line); border-radius: 9px; padding: 11px 12px;
        }
        .rp-field textarea { resize: vertical; min-height: 38vh; min-height: 38dvh; line-height: 1.6; }
        .rp-field input:focus, .rp-field textarea:focus { outline: 2px solid var(--rp-accent); border-color: var(--rp-accent); }
        .rp-grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        @media (max-width: 440px) { .rp-grid2 { grid-template-columns: 1fr; } }
        .rp-box { background: var(--rp-surface); border: 1px solid var(--rp-line); border-radius: 10px; padding: 12px 14px; }
        .rp-box h3 { font-size: 13px; color: var(--rp-muted); font-weight: 600; margin-bottom: 4px; }
        .rp-box p { white-space: pre-wrap; }
        .rp-steps { display: flex; gap: 6px; flex: none; }
        .rp-steps i { width: 22px; height: 5px; border-radius: 3px; background: var(--rp-line); }
        .rp-steps i.on { background: var(--rp-accent); }
        .rp-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
        .rp-seg.two { grid-template-columns: 1fr 1fr; }
        .rp-seg button { min-height: 52px; border: 1px solid var(--rp-line); border-radius: 10px; background: var(--rp-surface); font: inherit; font-weight: 600; font-size: 15px; color: var(--rp-ink); cursor: pointer; }
        .rp-seg button[aria-pressed="true"] { background: var(--rp-accent); color: #fff; border-color: var(--rp-accent); }
        .rp-hint { font-size: 13px; color: var(--rp-muted); }
        .rp-drop { border: 2px dashed var(--rp-line); border-radius: 12px; padding: 20px 16px; text-align: center; background: var(--rp-surface); display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .rp-drop.over { border-color: var(--rp-accent); background: var(--rp-soft); }
        .rp-drop b { font-size: 15px; }
        .rp-drop .rp-big { flex: none; padding: 0 22px; }
        .rp-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .rp-actions .rp-big { min-width: 140px; }

        /* 고객확인 서명(가로 전체화면) */
        .rp-side { width: min(34%, 280px); flex: none; padding: 14px; display: flex; flex-direction: column; gap: 14px; border-right: 1px solid var(--rp-line); background: var(--rp-surface); overflow-y: auto; }
        .rp-sbody { flex: 1; display: flex; min-height: 0; }
        .rp-padwrap { flex: 1; min-width: 0; padding: 12px; display: flex; }
        .rp-pad { flex: 1; min-height: 0; position: relative; background: #fff; border: 1px solid var(--rp-line); border-radius: 10px; touch-action: none; }
        .rp-pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; touch-action: none; }
        .rp-pad .guide { position: absolute; left: 6%; right: 6%; bottom: 28%; border-bottom: 1px dashed #b8bec7; pointer-events: none; }
        .rp-pad .ph { position: absolute; left: 6%; bottom: 30%; color: #9aa3ae; font-size: 13px; pointer-events: none; }
        .rp-rot { display: none; flex: 1; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
        .rp-rot .ico { width: 64px; height: 40px; border: 3px solid var(--rp-accent); border-radius: 6px; animation: rpTurn 2.2s ease-in-out infinite; }
        @keyframes rpTurn { 0%, 30% { transform: rotate(90deg); } 70%, 100% { transform: rotate(0); } }
        @media (prefers-reduced-motion: reduce) { .rp-rot .ico { animation: none; } }
        .rp-sign.portrait:not(.force) .rp-sbody, .rp-sign.portrait:not(.force) .rp-sfoot { display: none; }
        .rp-sign.portrait:not(.force) .rp-rot { display: flex; }

<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ AS & CLAIM 주간 스케줄</h1>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>📅 주차 선택</label>
                <select id="weekFilter">
                    <option value="">전체 주차</option>
                </select>
            </div>
            <div class="filter-group">
                <label>👤 담당자</label>
                <select id="managerFilter">
                    <option value="">전체 담당자</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🏭 외주</label>
                <select id="vendorFilter">
                    <option value="">전체 외주</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📋 보기 방식</label>
                <div class="view-toggle">
                    <button type="button" class="view-btn active" id="cardViewBtn" data-view="card">카드보기</button>
                    <button type="button" class="view-btn" id="overviewViewBtn" data-view="overview">주간 전체보기</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-icon total">📊</div>
                <div class="stat-text">
                    <span class="stat-label">총 일정</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon week">📌</div>
                <div class="stat-text">
                    <span class="stat-label">금주 일정</span>
                    <span class="stat-value" id="weekCount">0</span>
                </div>
            </div>
        </div>

        <!-- 주간 전체보기 모드 전용 상단바: 다른 메뉴가 모두 숨겨진 상태에서
             화면으로 돌아가기 / 주차 이동을 담당하는 최소한의 컨트롤 -->
        <div class="overview-topbar" id="overviewTopbar">
            <button type="button" class="ob-exit-btn" id="obExitBtn">✕ 카드보기</button>
            <div class="ob-week-label" id="obWeekLabel">-</div>
            <div class="ob-nav">
                <button type="button" class="ob-nav-btn" id="obPrevBtn">◀ 전주</button>
                <button type="button" class="ob-nav-btn" id="obNextBtn">차주 ▶</button>
            </div>
        </div>

        <div class="content">
            <div class="week-header" id="weekHeader">
                <div class="week-title" id="weekTitle">전체 스케줄</div>
                <div class="week-range" id="weekRange"></div>
            </div>
            <div class="schedule-grid" id="scheduleGrid">
                <div class="no-data">
                    <div class="no-data-icon">📋</div>
                    <div class="no-data-text">데이터를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-week-nav" id="floatingWeekNav">
        <button type="button" class="float-nav-btn" id="prevWeekBtn" title="이전 주차로 이동">
            <span class="arrow">▲</span><span>전주</span>
        </button>
        <button type="button" class="float-nav-btn float-today-btn" id="goToTodayBtn" title="오늘 날짜로 이동">
            <span>오늘</span>
            <span class="float-today-week" id="floatingWeekLabel">-</span>
        </button>
        <button type="button" class="float-nav-btn" id="nextWeekBtn" title="다음 주차로 이동">
            <span class="arrow">▼</span><span>차주</span>
        </button>
    </div>

    <!-- 카드보기에서 항상 표시되는 "전체보기" 바로가기 버튼.
         주간 전체보기 모드에서는 body.overview-fullscreen에 의해
         floating-week-nav와 함께 자동으로 숨겨지지 않으므로 JS에서 직접 표시/숨김 제어 -->
    <button type="button" class="return-to-overview-btn" id="returnToOverviewBtn" title="전체보기">
        <span class="arrow">◀</span><span>전체보기</span>
    </button>

    <div class="week-toast" id="weekToast"></div>

    <!-- ===== A/S 레포트 시트 (등록 / 작성 / 고객확인 / 미리보기) ===== -->
    <section class="rp-sheet" id="rpRegSheet" hidden>
        <div class="rp-head"><button class="rp-x" type="button" data-rp-close="rpRegSheet" aria-label="닫기">닫기</button><h2 id="rpRegTitle">레포트 등록</h2></div>
        <div class="rp-main"><div class="rp-in" id="rpRegBody"></div></div>
        <div class="rp-foot"><button class="rp-big" type="button" data-rp-close="rpRegSheet">취소</button><button class="rp-big pri" type="button" id="rpRegSave">등록</button></div>
    </section>

    <section class="rp-sheet" id="rpWrSheet" hidden>
        <div class="rp-head"><button class="rp-x" type="button" data-rp-close="rpWrSheet" aria-label="닫기">닫기</button><h2 id="rpWrTitle">레포트 작성</h2><div class="rp-steps" id="rpWrSteps"></div></div>
        <div class="rp-main"><div class="rp-in" id="rpWrBody"></div></div>
        <div class="rp-foot" id="rpWrFoot"></div>
