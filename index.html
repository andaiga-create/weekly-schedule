        <div class="rp-head"><button class="rp-x" type="button" id="rpSignClose" aria-label="닫기">닫기</button><h2>고객확인</h2></div>
        <div class="rp-rot"><div class="ico"></div><b style="font-size:17px">휴대폰을 가로로 돌려 주세요</b><p class="rp-hint">서명 화면은 가로 전체화면에서 사용합니다.</p><button class="rp-btn" type="button" id="rpForceSign">세로로 서명하기</button></div>
        <div class="rp-sbody">
            <div class="rp-side">
                <div class="rp-field"><span class="rp-lab">만족도</span>
                    <div class="rp-seg two" id="rpSatSeg"><button type="button" data-v="sat" aria-pressed="false">만족</button><button type="button" data-v="dis" aria-pressed="false">불만족</button></div></div>
                <div class="rp-field"><label for="rpCDate">DATE <small>수정 가능</small></label><input id="rpCDate" type="date"></div>
                <p class="rp-hint">오른쪽 칸에 서명해 주세요. 서명은 양식의 고객확인 NAME 칸에 들어갑니다.</p>
            </div>
            <div class="rp-padwrap">
                <div class="rp-pad" id="rpPad"><canvas id="rpPadCv"></canvas><div class="guide"></div><div class="ph" id="rpPadPh">서명 SIGN</div></div>
            </div>
        </div>
        <div class="rp-foot rp-sfoot"><button class="rp-big" type="button" id="rpPadClear">지우기</button><button class="rp-big pri" type="button" id="rpSignDone" disabled>서명 완료</button></div>
    </section>

    <section class="rp-sheet" id="rpPvSheet" hidden>
        <div class="rp-head"><button class="rp-x" type="button" data-rp-close="rpPvSheet" aria-label="닫기">닫기</button><h2 id="rpPvTitle">양식 미리보기</h2></div>
        <div class="rp-main"><div id="rpPvBody"></div><p class="rp-hint" style="text-align:center;margin-top:12px">QSP-601-03(1) 원본 양식 위에 입력값을 배치한 미리보기입니다.</p></div>
    </section>

    <div class="rp-toast" id="rpToast" hidden></div>


    <script>
        // 전역 변수
        let allSchedules = [];
        let filteredSchedules = [];
        let viewMode = 'card'; // 'card' = 카드보기, 'overview' = 주간 전체보기(가로)
        let pendingHighlightUid = null;   // 전체보기에서 선택해 카드보기로 넘어갈 때, 스크롤/강조할 스케줄 uid
        let overviewReturnWeek = null;    // "전체보기로 돌아가기" 버튼을 눌렀을 때 복귀할 주차

        // GitHub에서 Excel 파일 자동 로드
        async function loadExcelFromGitHub() {
            try {
                // 캐시 방지를 위한 타임스탬프 추가
                const timestamp = new Date().getTime();
                const response = await fetch(`as_claim_weekly.xlsx?t=${timestamp}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                
                if (arrayBuffer.byteLength === 0) {
                    throw new Error('파일이 비어있습니다.');
                }
                
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                
                console.log('워크북 시트:', workbook.SheetNames); // 디버깅용
                
                // 첫 번째 시트 읽기 - header: 1로 원본 배열 형태로 읽기
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                console.log('첫 5행 원본 데이터:', rawData.slice(0, 5));
                
                // 헤더 행 찾기 (보통 첫 번째 또는 두 번째 행)
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(5, rawData.length); i++) {
                    const row = rawData[i];
                    if (row && row.length > 0 && 
                        (row.includes('주') || row.includes('일자') || row.includes('구분'))) {
                        headerRowIndex = i;
                        console.log(`헤더 발견: ${i}번째 행`, row);
                        break;
                    }
                }
                
                if (headerRowIndex === -1) {
                    throw new Error('Excel 파일에서 헤더를 찾을 수 없습니다.');
                }
                
                // 헤더를 기준으로 다시 파싱
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { 
                    range: headerRowIndex,
                    defval: ''
                });
                
                console.log('파싱된 데이터 샘플:', jsonData[0]);
                console.log('읽은 데이터 개수:', jsonData.length);
                
                if (jsonData.length === 0) {
                    throw new Error('Excel 파일에 데이터가 없습니다.');
                }
                
                // 데이터 변환 및 처리
                processExcelData(jsonData);
                
                console.log(`✅ ${jsonData.length}개의 일정을 불러왔습니다.`);
            } catch (error) {
                console.error('Excel 파일 읽기 오류:', error);
                document.getElementById('scheduleGrid').innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">❌</div>
                        <div class="no-data-text">파일을 불러오는 중 오류가 발생했습니다</div>
                        <div style="margin-top: 10px; font-size: 13px; color: #6c757d;">
                            ${error.message}<br><br>
                            • as_claim_weekly.xlsx 파일이 같은 경로에 있는지 확인해주세요<br>
                            • 브라우저 콘솔(F12)에서 자세한 오류를 확인하세요
                        </div>
                    </div>
                `;
            }
        }

        // 날짜로부터 주차 계산 (YYYY년 N주 형식)
        function getWeekFromDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            
            // 해당 연도의 1월 1일
            const yearStart = new Date(year, 0, 1);
            
            // 1월 1일부터 해당 날짜까지의 일수
            const daysDiff = Math.floor((date - yearStart) / (24 * 60 * 60 * 1000));
            
            // 주차 계산 (1월 1일이 속한 주를 1주로)
            const weekNumber = Math.ceil((daysDiff + yearStart.getDay() + 1) / 7);
            
            return `${weekNumber}주`;
        }

        // Excel 데이터 처리 및 변환
        function processExcelData(jsonData) {
            console.log('========== 데이터 처리 시작 ==========');
            console.log('원본 데이터 샘플:', jsonData[0]); // 디버깅용
            console.log('원본 데이터 전체 개수:', jsonData.length);
            
            // 컬럼명 확인
            if (jsonData.length > 0) {
                console.log('Excel 컬럼명 목록:', Object.keys(jsonData[0]));
            }
            
            allSchedules = jsonData.map((item, index) => {
                // Excel 날짜를 JavaScript 날짜로 변환
                let dateStr = item['일자'];
                
                // 첫 5개 항목만 상세 로그
                if (index < 5) {
                    console.log(`[${index}] 원본 일자:`, dateStr, '타입:', typeof dateStr);
                }
                
                if (typeof dateStr === 'number') {
                    // Excel 날짜 시리얼 번호를 날짜로 변환
                    const excelDate = new Date((dateStr - 25569) * 86400 * 1000);
                    const year = excelDate.getFullYear();
                    const month = String(excelDate.getMonth() + 1).padStart(2, '0');
                    const day = String(excelDate.getDate()).padStart(2, '0');
                    dateStr = `${year}-${month}-${day}`;
                    if (index < 5) {
                        console.log(`[${index}] 변환된 날짜:`, dateStr);
                    }
                } else if (dateStr && typeof dateStr === 'string') {
                    // 문자열 날짜 처리
                    if (dateStr.includes('/')) {
                        // "YYYY/MM/DD" 형식을 "YYYY-MM-DD"로 변환
                        dateStr = dateStr.replace(/\//g, '-');
                    } else if (dateStr.includes(' ')) {
                        // "YYYY-MM-DD HH:MM:SS" 형식에서 날짜 부분만 추출
                        dateStr = dateStr.split(' ')[0];
                    }
                    if (index < 5) {
                        console.log(`[${index}] 문자열 날짜:`, dateStr);
                    }
                } else {
                    // 날짜가 없는 경우에도 로그
                    if (index < 5) {
                        console.log(`[${index}] 날짜 없음 - null 처리`);
                    }
                    dateStr = null;
                }

                return {
                    _uid: index, // 카드보기 ↔ 전체보기 연결을 위한 고유 식별자
                    주: dateStr ? getWeekFromDate(dateStr) : '', // 일자 기준으로 주차 자동 계산
                    일자: dateStr,
                    일자_str: dateStr,
                    구분: item['구분'] || '',
                    인도일: item['인도일'] || '',
                    조선소_장소: item['조선소\r\n장소'] || item['조선소/장소'] || '',
                    호선: item['호 선'] || item['호선'] || '',
                    장비: item['장비'] || '',
                    검사종류_고객요청사항: item['검사종류 / 고객요청사항'] || item['검사종류/고객요청사항'] || '',
                    담당자: item['담당자'] || '',
                    외주: item['외주'] || '',
                    유무상: item['유/무상'] || item['유무상'] || '',
                    차량: item['차량'],
                    출장인원: item['출장인원'] || '',
                    비고: item['비고'] || ''
                };
            });
            
            console.log('변환 완료 - 전체 항목:', allSchedules.length);
            
            // 첫 5개 항목의 주차, 유무상, 검사종류 정보 확인
            console.log('주차, 유무상, 검사종류 샘플:');
            allSchedules.slice(0, 5).forEach((s, i) => {
                console.log(`  [${i}] 일자: ${s.일자} → 주차: ${s.주}, 유무상: "${s.유무상}", 검사종류: "${s.검사종류_고객요청사항}"`);
            });
            
            // 필터링: 날짜가 없거나 구분이 빈칸인 항목 제거
            const beforeFilter = allSchedules.length;
            allSchedules = allSchedules.filter(s => {
                // 날짜가 없으면 제외
                if (!s.일자 || s.일자 === null || s.일자 === '') return false;
                // 구분이 빈칸이면 제외
                if (!s.구분 || s.구분 === '') return false;
                return true;
            });
            const afterFilter = allSchedules.length;
            
            console.log(`필터링: ${beforeFilter}개 → ${afterFilter}개 (${beforeFilter - afterFilter}개 제거)`);
            console.log('처리된 데이터 샘플:', allSchedules[0]); // 디버깅용
            console.log('========== 데이터 처리 완료 ==========');

            initializeData();
        }

        // 스케줄 데이터 (기본값 - 빈 배열)
        const scheduleData = [];

        // 날짜 포맷팅 함수
        function formatDate(dateStr) {
            if (!dateStr) return 'Invalid Date';
            
            const date = new Date(dateStr);
            
            // Invalid Date 체크
            if (isNaN(date.getTime())) {
                console.error('잘못된 날짜:', dateStr);
                return 'Invalid Date';
            }
            
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const weekday = weekdays[date.getDay()];
            return `${year}.${month}.${day} (${weekday})`;
        }

        // 필터 초기화 함수
        function clearFilters() {
            const weekFilter = document.getElementById('weekFilter');
            const managerFilter = document.getElementById('managerFilter');
            const vendorFilter = document.getElementById('vendorFilter');

            // 기존 옵션 제거 (첫 번째 기본 옵션 제외)
            while (weekFilter.options.length > 1) weekFilter.remove(1);
            while (managerFilter.options.length > 1) managerFilter.remove(1);
            while (vendorFilter.options.length > 1) vendorFilter.remove(1);
        }

        // 현재 주차 계산 - 오늘 날짜가 속한 주차 반환

        // 17시 이후에는 '오늘' 기준을 익일로 당겨서 계산
        // (퇴근 시간 이후에는 당일 스케줄보다 다음 일정이 더 의미있게 보이도록)
        function getEffectiveToday() {
            const now = new Date();
            const effective = new Date(now);
            effective.setHours(0, 0, 0, 0);

            if (now.getHours() >= 17) {
                effective.setDate(effective.getDate() + 1);
            }

            return effective;
        }

        // 로컬 시간대 기준 YYYY-MM-DD 문자열 생성 (toISOString의 UTC 오차 방지)
        function toLocalDateStr(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getCurrentWeek() {
            const today = getEffectiveToday();
            
            const todayStr = toLocalDateStr(today);
            const currentWeek = getWeekFromDate(todayStr);
            
            console.log('=== 현재 주차 계산 ===');
            console.log('기준 날짜(17시 이후 익일 보정):', todayStr);
            console.log('기준일의 주차:', currentWeek);
            
            // 데이터에 현재 주차가 있는지 확인
            const hasCurrentWeek = allSchedules.some(s => s.주 === currentWeek);
            console.log('데이터에 현재 주차 존재 여부:', hasCurrentWeek);
            
            if (hasCurrentWeek) {
                return currentWeek;
            }
            
            // 현재 주차에 스케줄이 없으면 가장 가까운 미래 주차 찾기
            console.log('현재 주차에 스케줄 없음, 가장 가까운 미래 주차 찾기');
            let closestFutureWeek = null;
            let minDiff = Infinity;
            
            for (let schedule of allSchedules) {
                const scheduleDate = new Date(schedule.일자);
                scheduleDate.setHours(0, 0, 0, 0);
                const diff = scheduleDate - today;
                
                // 오늘 이후의 날짜 중 가장 가까운 것
                if (diff >= 0 && diff < minDiff) {
                    minDiff = diff;
                    closestFutureWeek = schedule.주;
                }
            }
            
            if (closestFutureWeek) {
                console.log('가장 가까운 미래 주차:', closestFutureWeek);
                return closestFutureWeek;
            }
            
            // 미래 스케줄도 없으면 가장 가까운 주차 (과거 포함)
            let closestWeek = null;
            minDiff = Infinity;
            
            for (let schedule of allSchedules) {
                const scheduleDate = new Date(schedule.일자);
                const diff = Math.abs(scheduleDate - today);
                
                if (diff < minDiff) {
                    minDiff = diff;
                    closestWeek = schedule.주;
                }
            }
            
            console.log('가장 가까운 주차(과거 포함):', closestWeek);
            return closestWeek;
        }

        // 데이터에서 주차 목록 추출 (숫자 순 정렬, NaN 등 비정상값 제외)
        function extractWeeks(data) {
            return [...new Set(data.map(s => s.주))]
                .filter(w => w && /^\d+주$/.test(String(w).trim()))
                .sort((a, b) => parseInt(a) - parseInt(b));
        }

        // 데이터에서 담당자 목록 추출
        function extractManagers(data) {
            return [...new Set(data
                .filter(s => s.담당자 && s.담당자 !== 'nan' && typeof s.담당자 === 'string')
                .flatMap(s => s.담당자.split(',').map(m => m.trim()))
            )].sort();
        }

        // 데이터에서 외주 목록 추출
        function extractVendors(data) {
            const vendorsSet = new Set();
            data.forEach(s => {
                if (s.외주 && s.외주 !== 'nan' && typeof s.외주 === 'string') {
                    s.외주.split(',').map(v => v.replace(/\([^)]*\)/g, '').trim().replace(/\n/g, ''))
                        .forEach(v => { if (v && v !== '?' && v !== '외주') vendorsSet.add(v); });
                }
            });
            return [...vendorsSet].sort();
        }

        // 선택값을 유지하면서 select 옵션 업데이트
        function updateSelectOptions(selectEl, items, prevValue) {
            while (selectEl.options.length > 1) selectEl.remove(1);
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                selectEl.appendChild(opt);
            });
            selectEl.value = items.includes(prevValue) ? prevValue : '';
        }

        // 3개 필터를 현재 선택 기준으로 연동 갱신
        function updateLinkedFilters() {
            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            const selWeek    = weekEl.value;
            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            // 주차 옵션: manager + vendor 기준 데이터에서 추출
            const forWeek = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            // 담당자 옵션: week + vendor 기준 데이터에서 추출
            const forManager = allSchedules.filter(s => {
                const wOk = !selWeek   || s.주 === selWeek;
                const vOk = !selVendor || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return wOk && vOk;
            });

            // 외주 옵션: week + manager 기준 데이터에서 추출
            const forVendor = allSchedules.filter(s => {
                const wOk = !selWeek    || s.주 === selWeek;
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                return wOk && mOk;
            });

            updateSelectOptions(weekEl,    extractWeeks(forWeek),       selWeek);
            updateSelectOptions(managerEl, extractManagers(forManager), selManager);
            updateSelectOptions(vendorEl,  extractVendors(forVendor),   selVendor);
        }

        // 데이터 초기화
        function initializeData() {
            if (allSchedules.length === 0) return;

            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            // 초기 전체 옵션 세팅
            clearFilters();
            updateWeekFilter();  // 주차 (현재 주차 자동 선택 포함)
            extractManagers(allSchedules).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                managerEl.appendChild(opt);
            });
            extractVendors(allSchedules).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v;
                vendorEl.appendChild(opt);
            });

            // 주차가 기본 선택된 상태에서 연동 갱신 (담당자/외주 목록 좁히기)
            updateLinkedFilters();

            // 필터 이벤트 리스너: 변경 시 연동 갱신 → 렌더링
            [weekEl, managerEl, vendorEl].forEach(el => {
                el.addEventListener('change', () => {
                    clearOverviewReturnWeek();
                    updateLinkedFilters();
                    if (viewMode === 'overview') {
                        ensureWeekSelectedForOverview();
                    }
                    applyFilters();
                });
            });

            applyFilters();
        }

        // 연도에 따라 주차 필터 업데이트
        function updateWeekFilter() {
            const weekFilter = document.getElementById('weekFilter');
            
            // 기존 옵션 제거 (첫 번째 "전체 주차" 제외)
            while (weekFilter.options.length > 1) {
                weekFilter.remove(1);
            }
            
            // 주차 목록 추출 및 정렬 (숫자 형식만, 순차 정렬)
            const weeks = [...new Set(allSchedules.map(s => s.주))]
                .filter(w => w && /^\d+주$/.test(String(w).trim()))
                .sort((a, b) => parseInt(a) - parseInt(b));
            
            console.log('=== 주차 필터 업데이트 ===');
            console.log('전체 주차 목록:', weeks);
            
            weeks.forEach(week => {
                const option = document.createElement('option');
                option.value = week;
                option.textContent = week;
                weekFilter.appendChild(option);
            });

            // 현재 주차 설정
            const currentWeek = getCurrentWeek();
            console.log('현재 주차:', currentWeek);
            console.log('주차 목록에 포함 여부:', weeks.includes(currentWeek));
            
            if (currentWeek && weeks.includes(currentWeek)) {
                weekFilter.value = currentWeek;
                console.log('주차 필터 설정 완료:', weekFilter.value);
            } else {
                weekFilter.value = '';
                console.log('주차 필터를 전체로 설정');
            }
        }

        // 필터 적용
        function applyFilters() {
            const weekFilter = document.getElementById('weekFilter').value;
            const managerFilter = document.getElementById('managerFilter').value;
            const vendorFilter = document.getElementById('vendorFilter').value;

            filteredSchedules = allSchedules.filter(schedule => {
                // 주차 필터 (주차가 선택되면 해당 주의 모든 스케줄 표시)
                if (weekFilter && schedule.주 !== weekFilter) return false;

                // 담당자 필터 - 정확한 매칭
                if (managerFilter) {
                    const 담당자 = schedule.담당자;
                    // 담당자가 없거나 NaN인 경우 제외
                    if (!담당자 || 담당자 === 'nan' || typeof 담당자 !== 'string') {
                        return false;
                    }
                    // 쉼표로 구분된 담당자 목록에서 정확히 일치하는지 확인
                    const 담당자목록 = 담당자.split(',').map(m => m.trim());
                    if (!담당자목록.includes(managerFilter)) {
                        return false;
                    }
                }

                // 외주 필터 - 정확한 매칭
                if (vendorFilter) {
                    const 외주 = schedule.외주;
                    // 외주가 없거나 NaN인 경우 제외
                    if (!외주 || 외주 === 'nan' || typeof 외주 !== 'string') {
                        return false;
                    }
                    const cleanVendor = 외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '');
                    if (!cleanVendor.includes(vendorFilter)) {
                        return false;
                    }
                }

                return true;
            });

            renderSchedules();
        }

        // 스케줄 렌더링
        function renderSchedules() {
            const grid = document.getElementById('scheduleGrid');
            const weekFilter = document.getElementById('weekFilter').value;
            
            // 금주 일정 계산 (현재 주차의 일정 수)
            const currentWeek = getCurrentWeek();
            const thisWeekSchedules = allSchedules.filter(s => s.주 === currentWeek);
            
            // 통계 업데이트
            document.getElementById('totalCount').textContent = allSchedules.length;
            document.getElementById('weekCount').textContent = thisWeekSchedules.length;

            // 플로팅 전주/차주 위젯 라벨 갱신
            const floatLabel = document.getElementById('floatingWeekLabel');
            if (floatLabel) {
                floatLabel.textContent = weekFilter || currentWeek || '-';
            }

            // 카드보기 여부에 따라 "전체보기" 바로가기 버튼 표시 상태 동기화
            updateFloatingOverviewBtn();

            // 주차 헤더 업데이트
            if (weekFilter) {
                const weekSchedules = filteredSchedules.filter(s => s.주 === weekFilter);
                if (weekSchedules.length > 0) {
                    const dates = weekSchedules.map(s => new Date(s.일자));
                    const minDate = new Date(Math.min(...dates));
                    const maxDate = new Date(Math.max(...dates));
                    document.getElementById('weekTitle').textContent = `${weekFilter} 스케줄`;
                    document.getElementById('weekRange').textContent = 
                        `${formatDate(minDate.toISOString())} ~ ${formatDate(maxDate.toISOString())}`;
                }
            } else {
                document.getElementById('weekTitle').textContent = '전체 스케줄';
                document.getElementById('weekRange').textContent = '';
            }

            // 주간 전체보기 상단바 라벨 갱신 (예: "35주 · 08.24 (월) ~ 08.28 (금)")
            const obLabel = document.getElementById('obWeekLabel');
            if (obLabel) {
                const wTitle = document.getElementById('weekTitle').textContent;
                const wRange = document.getElementById('weekRange').textContent;
                obLabel.textContent = wRange ? `${wTitle} · ${wRange}` : wTitle;
            }

            if (filteredSchedules.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">🔍</div>
                        <div class="no-data-text">조건에 맞는 일정이 없습니다</div>
                    </div>
                `;
                return;
            }

            // 주간 전체보기 모드: 가로형 요일 보드로 렌더링
            if (viewMode === 'overview') {
                grid.innerHTML = renderOverviewBoard(weekFilter);
                return;
            }

            // 날짜별로 그룹화 및 정렬
            const grouped = {};
            filteredSchedules.forEach(schedule => {
                const date = schedule.일자;
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(schedule);
            });

            const sortedDates = Object.keys(grouped).sort();
            
            grid.innerHTML = sortedDates.map(date => {
                const schedules = grouped[date];
                return schedules.map(schedule => createScheduleCard(schedule, date)).join('');
            }).join('');

            // 전체보기에서 특정 스케줄을 선택해 넘어온 경우, 오늘 날짜 대신
            // 해당 스케줄 카드로 스크롤 + 강조 표시
            // 전체보기에서 특정 스케줄을 선택해 넘어온 경우에만 해당 카드로 스크롤/강조.
            // (초기 진입 시 오늘 날짜로 자동 스크롤하던 기능은 제거 — 필터 섹션이 먼저 보이도록 함.
            //  오늘 날짜로 이동은 우측 하단 "오늘" 버튼으로 언제든 수동 실행 가능)
            if (pendingHighlightUid !== null) {
                scrollToAndHighlightSchedule(pendingHighlightUid);
                pendingHighlightUid = null;
            }
        }

        // 주차 선택 없이 주간 전체보기로 전환된 경우, 현재 주차(또는 첫 주차)를 자동 선택
        function ensureWeekSelectedForOverview() {
            const weekEl = document.getElementById('weekFilter');
            if (weekEl.value) return;

            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');
            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            const filteredForWeeks = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            const weeks = extractWeeks(filteredForWeeks);
            if (weeks.length === 0) return;

            const currentWeek = getCurrentWeek();
            weekEl.value = weeks.includes(currentWeek) ? currentWeek : weeks[0];
            updateLinkedFilters();
        }

        // 주간 전체보기: 월~일 7일 가로 보드 생성
        function renderOverviewBoard(weekFilter) {
            if (!weekFilter) {
                return `
                    <div class="no-data">
                        <div class="no-data-icon">📅</div>
                        <div class="no-data-text">전체보기는 특정 주차를 선택했을 때 표시됩니다</div>
                    </div>
                `;
            }

            // 요일 배치는 담당자/외주 필터와 무관하게 그 주에 실제 존재하는 날짜 전체를 기준으로 계산
            // (필터링으로 일부 요일의 일정이 사라져도 요일 칸 자체는 유지되도록)
            const weekAllDates = allSchedules
                .filter(s => s.주 === weekFilter && s.일자)
                .map(s => s.일자)
                .sort();

            if (weekAllDates.length === 0) {
                return `
                    <div class="no-data">
                        <div class="no-data-icon">📋</div>
                        <div class="no-data-text">해당 주차에 일정이 없습니다</div>
                    </div>
                `;
            }

            // 해당 주의 월요일 계산 후 7일(월~일) 생성
            const firstDate = new Date(weekAllDates[0] + 'T00:00:00');
            const dow = firstDate.getDay(); // 0=일 ... 6=토
            // 일요일(0)은 해당 주의 '첫째 날'이므로 다음날(+1)이 월요일,
            // 월~토(1~6)는 (dow-1)일 전이 월요일
            const mondayOffset = dow === 0 ? -1 : dow - 1;
            const monday = new Date(firstDate);
            monday.setDate(monday.getDate() - mondayOffset);

            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(d.getDate() + i);
                days.push(toLocalDateStr(d));
            }

            // 필터(담당자/외주)까지 반영된 스케줄을 날짜별로 그룹화
            const grouped = {};
            filteredSchedules.forEach(schedule => {
                if (!grouped[schedule.일자]) grouped[schedule.일자] = [];
                grouped[schedule.일자].push(schedule);
            });

            const weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const todayStr = toLocalDateStr(getEffectiveToday());

            // 요일별 데이터 구성 (토/일요일은 일정이 없으면 화면에서 제외하여
            // 가시성을 높이고, 평일 칸이 더 넓게 화면을 채우도록 함)
            const dayInfos = days.map(dateStr => {
                const d = new Date(dateStr + 'T00:00:00');
                const weekdayIdx = d.getDay();
                const isWeekend = weekdayIdx === 0 || weekdayIdx === 6;
                const items = grouped[dateStr] || [];
                return { dateStr, d, weekdayIdx, isWeekend, items };
            }).filter(day => !(day.isWeekend && day.items.length === 0));

            const daysHtml = dayInfos.map(({ dateStr, d, weekdayIdx, isWeekend, items }) => {
                const isToday = dateStr === todayStr;

                return `
                    <div class="overview-day ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">
                        <div class="overview-day-header">
                            <div>
                                <span class="overview-day-date">${d.getMonth() + 1}/${d.getDate()}</span>
                                <span class="overview-day-weekday">(${weekdayNames[weekdayIdx]})</span>
                            </div>
                            ${items.length > 0 ? `<div class="overview-day-count">${items.length}건</div>` : ''}
                        </div>
                        <div class="overview-day-body">
                            ${items.length === 0
                                ? '<div class="overview-empty">일정 없음</div>'
                                : items.map(item => createOverviewItem(item)).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            return `<div class="overview-board">${daysHtml}</div>`;
        }

        // 주간 전체보기용 압축 카드 (외주 정보 강조)
        function createOverviewItem(schedule) {
            const 구분Value = schedule.구분 ? String(schedule.구분).trim() : '';
            let itemClass = '';
            let 구분Badge = '';
            if (구분Value === 'A/S') {
                구분Badge = '<span class="badge as">A/S</span>';
            } else if (구분Value === 'CLAIM' || 구분Value === '클레임') {
                구분Badge = '<span class="badge claim">CLAIM</span>';
                itemClass = 'claim';
            } else if (구분Value === '사내') {
                구분Badge = '<span class="badge naeso">사내</span>';
                itemClass = 'naeso';
            } else if (구분Value && 구분Value !== 'nan') {
                구분Badge = `<span class="badge default">${구분Value}</span>`;
            }

            let 유무상Badge = '';
            const 유무상Value = schedule.유무상;
            if (유무상Value) {
                const 유무상Str = String(유무상Value).trim();
                if (유무상Str.includes('무상')) {
                    유무상Badge = '<span class="badge free">무상</span>';
                } else if (유무상Str.includes('유상')) {
                    유무상Badge = '<span class="badge paid">유상</span>';
                }
            }

            const 외주텍스트 = (schedule.외주 && schedule.외주 !== 'nan')
                ? String(schedule.외주).replace(/\n/g, ' ').trim()
                : '';

            return `
                <div class="overview-item ${itemClass}" data-uid="${schedule._uid}" onclick="openScheduleFromOverview(${schedule._uid})">
                    <div class="overview-item-top">
                        ${구분Badge}${유무상Badge}
                    </div>
                    ${schedule.조선소_장소 ? `<div class="overview-item-place">${schedule.조선소_장소}</div>` : ''}
                    <div class="overview-item-sub">${[schedule.호선, schedule.장비].filter(Boolean).join(' · ')}</div>
                    ${외주텍스트 ? `<div class="overview-vendor">🏭 ${외주텍스트}</div>` : ''}
                    ${schedule.담당자 && schedule.담당자 !== 'nan' ? `<div class="overview-item-manager">👤 ${schedule.담당자}</div>` : ''}
                    ${schedule.차량 && schedule.차량 !== 'nan' ? `<div class="overview-item-vehicle">🚚 ${schedule.차량}</div>` : ''}
                </div>
            `;
        }

        // 오늘 날짜 카드로 자동 스크롤
        function scrollToToday() {
            // 약간의 지연을 주어 DOM이 완전히 렌더링된 후 스크롤
            setTimeout(() => {
                const today = getEffectiveToday();
                
                // 로컬 시간대를 사용한 날짜 문자열 생성 (YYYY-MM-DD)
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const todayStr = `${year}-${month}-${day}`;
                
                console.log('=== 자동 스크롤 시작 ===');
                console.log('기준 날짜(17시 이후 익일 보정):', todayStr);
                
                // 모든 카드 가져오기
                const allCards = document.querySelectorAll('.schedule-card[data-date]');
                
                if (allCards.length === 0) {
                    console.log('카드가 없습니다.');
                    return;
                }
                
                // 1. 오늘 날짜 카드 먼저 찾기
                let targetCard = document.querySelector(`[data-date="${todayStr}"]`);
                
                if (targetCard) {
                    console.log('오늘 날짜 카드 발견');
                } else {
                    console.log('오늘 날짜 카드 없음, 가장 가까운 미래 날짜 찾기');
                    
                    // 2. 가장 가까운 미래 날짜 찾기 (내일, 모레...)
                    let closestFutureCard = null;
                    let minDiff = Infinity;
                    
                    allCards.forEach(card => {
                        const cardDateStr = card.getAttribute('data-date');
                        const cardDate = new Date(cardDateStr + 'T00:00:00');
                        const diff = cardDate - today; // 미래는 양수
                        
                        // 오늘 이후의 날짜 중 가장 가까운 것
                        if (diff > 0 && diff < minDiff) {
                            minDiff = diff;
                            closestFutureCard = card;
                        }
                    });
                    
                    if (closestFutureCard) {
                        targetCard = closestFutureCard;
                        const futureDate = targetCard.getAttribute('data-date');
                        console.log('가장 가까운 미래 날짜:', futureDate);
                    } else {
                        // 3. 미래 일정도 없으면 가장 가까운 과거 날짜
                        console.log('미래 일정 없음, 가장 가까운 과거 날짜 찾기');
                        let closestPastCard = null;
                        minDiff = Infinity;
                        
                        allCards.forEach(card => {
                            const cardDateStr = card.getAttribute('data-date');
                            const cardDate = new Date(cardDateStr + 'T00:00:00');
                            const diff = today - cardDate;
                            
                            // 오늘 이전의 날짜 중 가장 가까운 것
                            if (diff > 0 && diff < minDiff) {
                                minDiff = diff;
                                closestPastCard = card;
                            }
                        });
                        
                        targetCard = closestPastCard || allCards[0];
                        
                        if (targetCard) {
                            const pastDate = targetCard.getAttribute('data-date');
                            console.log('가장 가까운 과거 날짜:', pastDate);
                        }
                    }
                }
                
                if (targetCard) {
                    console.log('스크롤 대상:', targetCard.getAttribute('data-date'));
                    
                    // 부드러운 스크롤
                    targetCard.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start'
                    });
                    
                    // 카드 강조 효과
                    targetCard.style.animation = 'highlight 2s ease-in-out';
                }
            }, 500);
        }

        // 특정 uid의 스케줄 카드로 스크롤하며 강조 표시
        // (전체보기에서 스케줄을 선택해 카드보기로 넘어왔을 때 사용)
        function scrollToAndHighlightSchedule(uid) {
            setTimeout(() => {
                const targetCard = document.querySelector(`.schedule-card[data-uid="${uid}"]`);
                if (!targetCard) return;

                targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                targetCard.classList.add('highlighted');

                // 잠시 후 강조 효과 제거 (카드 자체 스타일은 유지)
                setTimeout(() => {
                    targetCard.classList.remove('highlighted');
                }, 2800);
            }, 400);
        }

        // 전체보기에서 특정 스케줄 카드를 클릭했을 때: 카드보기로 전환하며
        // 해당 스케줄로 스크롤/강조. 되돌아갈 주차를 기억해 두었다가
        // "전체보기" 버튼으로 복귀할 수 있게 함
        function openScheduleFromOverview(uid) {
            overviewReturnWeek = document.getElementById('weekFilter').value;
            pendingHighlightUid = uid;

            viewMode = 'card';
            setActiveViewButton('card');
            setOverviewFullscreen(false);
            applyFilters();

            updateFloatingOverviewBtn();
        }

        // "전체보기" 바로가기 버튼: 카드보기일 때는 항상 표시, 주간 전체보기일 때는 숨김
        function updateFloatingOverviewBtn() {
            const btn = document.getElementById('returnToOverviewBtn');
            if (btn) btn.classList.toggle('show', viewMode === 'card');
        }

        // 주차가 수동으로 바뀌면(필터 변경, 전/차주 이동 등) 기억해 둔 복귀 주차는
        // 더 이상 유효하지 않으므로 초기화 — "전체보기" 클릭 시 현재 선택된 주차로 이동하게 됨
        function clearOverviewReturnWeek() {
            overviewReturnWeek = null;
        }

        // 전체보기로 이동 (특정 스케줄에서 넘어온 경우 그 주차로, 아니면 현재 선택된 주차로)
        function returnToOverview() {
            if (overviewReturnWeek !== null) {
                document.getElementById('weekFilter').value = overviewReturnWeek;
                updateLinkedFilters();
            }

            viewMode = 'overview';
            setActiveViewButton('overview');
            setOverviewFullscreen(true);
            applyFilters();

            clearOverviewReturnWeek();
            updateFloatingOverviewBtn();
        }

        // 스케줄 카드 생성
        function createScheduleCard(schedule, date) {
            const 구분Value = schedule.구분 ? String(schedule.구분).trim() : '';
            let 구분Badge = '';
            if (구분Value === 'A/S') {
                구분Badge = '<span class="badge as">A/S</span>';
            } else if (구분Value === 'CLAIM' || 구분Value === '클레임') {
                구분Badge = '<span class="badge claim">CLAIM</span>';
            } else if (구분Value === '사내') {
                구분Badge = '<span class="badge naeso">사내</span>';
            } else if (구분Value && 구분Value !== 'nan') {
                구분Badge = `<span class="badge default">${구분Value}</span>`;
            }
            
            // 유무상 정보 처리 (다양한 형식 지원)
            let 유무상Badge = '';
            const 유무상Value = schedule.유무상;
            
            if (유무상Value) {
                const 유무상Str = String(유무상Value).trim();
                if (유무상Str.includes('무상') || 유무상Str === '무상') {
                    유무상Badge = '<span class="badge free">무상</span>';
                } else if (유무상Str.includes('유상') || 유무상Str === '유상') {
                    유무상Badge = '<span class="badge paid">유상</span>';
                }
            }

            return `
                <div class="schedule-card" data-date="${date}" data-uid="${schedule._uid}">
                    <div class="card-header">
                        <div class="card-date">
                            <div class="date-main">${formatDate(schedule.일자)}</div>
                            <div class="date-week">${schedule.주}</div>
                        </div>
                        <div class="card-badges">
                            ${구분Badge}
                            ${유무상Badge}
                        </div>
                    </div>
                    <div class="card-body">
                        ${schedule.조선소_장소 ? `
                        <div class="info-row">
                            <div class="info-label">조선소(장소)</div>
                            <div class="info-value highlight">${schedule.조선소_장소}</div>
                        </div>` : ''}
                        
                        ${schedule.장비 ? `
                        <div class="info-row">
                            <div class="info-label">장비</div>
                            <div class="info-value">${schedule.장비}</div>
                        </div>` : ''}
                        
                        ${schedule.호선 ? `
                        <div class="info-row">
                            <div class="info-label">호선</div>
                            <div class="info-value">${schedule.호선}</div>
                        </div>` : ''}
                        
                        ${schedule.검사종류_고객요청사항 ? `
                        <div class="info-row">
                            <div class="info-label">검사종류(고객요청사항)</div>
                            <div class="info-value">${schedule.검사종류_고객요청사항}</div>
                        </div>` : ''}
                        
                        ${schedule.담당자 && schedule.담당자 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">담당자</div>
                            <div class="info-value highlight">${schedule.담당자}</div>
                        </div>` : ''}
                        
                        ${schedule.외주 && schedule.외주 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">외주</div>
                            <div class="info-value">${schedule.외주}</div>
                        </div>` : ''}
                        
                        ${schedule.차량 && schedule.차량 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">차량</div>
                            <div class="info-value">${schedule.차량}</div>
                        </div>` : ''}
                        
                        ${schedule.출장인원 ? `
                        <div class="info-row">
                            <div class="info-label">출장인원</div>
                            <div class="info-value">${schedule.출장인원}명</div>
                        </div>` : ''}
                        
                        ${schedule.비고 && schedule.비고 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">비고</div>
                            <div class="info-value">${schedule.비고.replace(/\n/g, '<br>')}</div>
                        </div>` : ''}
                    </div>
                    ${window.rpRow ? window.rpRow(schedule) : ''}
                </div>
            `;
        }

        // 전주(◀) / 차주(▶) 이동
        // 주차 선택이 비어있으면(전체 주차) 현재 기준 주차에서 출발
        // 화면 하단에 짧게 알림 문구를 띄우는 토스트
        let toastTimer = null;
        function showToast(message) {
            const toastEl = document.getElementById('weekToast');
            if (!toastEl) return;

            toastEl.textContent = message;
            toastEl.classList.add('show');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2200);
        }

        function shiftWeek(direction) {
            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            // 현재 선택된 담당자/외주 필터를 반영한 데이터에서만 주차를 추출
            // (전체 데이터 기준으로 주차를 뽑으면, 해당 담당자/외주 일정이 없는 주차로
            //  이동하게 되고, 이후 updateLinkedFilters()에서 "선택값이 옵션에 없음"으로
            //  판단되어 담당자/외주/주차 필터가 모두 초기화되는 버그가 발생함)
            const filteredForWeeks = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            const weeks = extractWeeks(filteredForWeeks);
            if (weeks.length === 0) {
                showToast('선택한 조건에 해당하는 일정이 없습니다.');
                return;
            }

            const currentVal = weekEl.value;

            let idx = currentVal ? weeks.indexOf(currentVal) : -1;

            if (idx === -1) {
                // 전체 주차 상태 → 현재(기준) 주차를 출발점으로 사용
                const baseWeek = getCurrentWeek();
                const baseIdx = weeks.indexOf(baseWeek);
                idx = baseIdx === -1 ? (direction > 0 ? -1 : weeks.length) : baseIdx;
            }

            const rawNewIdx = idx + direction;
            const newIdx = Math.max(0, Math.min(weeks.length - 1, rawNewIdx));

            // 필터(담당자/외주) 적용 기준으로 더 이상 이동할 주차가 없는 경우 안내
            if (rawNewIdx !== newIdx) {
                const filterLabel = [selManager, selVendor].filter(Boolean).join(' / ');
                const suffix = filterLabel ? ` (${filterLabel} 기준)` : '';
                const message = direction > 0
                    ? `다음 일정이 없습니다.${suffix}`
                    : `이전 일정이 없습니다.${suffix}`;
                showToast(message);
            }

            weekEl.value = weeks[newIdx];
            updateLinkedFilters();
            applyFilters();
        }

        // 담당자/외주 필터가 걸린 상태에서도 특정 주차에 일정이 존재하는지 확인
        function weekAvailableWithCurrentFilters(week) {
            const selManager = document.getElementById('managerFilter').value;
            const selVendor  = document.getElementById('vendorFilter').value;
            return allSchedules.some(s => {
                if (s.주 !== week) return false;
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });
        }

        // "오늘" 버튼: 오늘(또는 가장 가까운 일정)이 속한 주차로 필터를 자동 전환한 뒤
        // 해당 날짜 카드로 스크롤/강조
        function goToToday() {
            const targetWeek = getCurrentWeek();
            if (!targetWeek) { scrollToToday(); return; }

            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            // 담당자/외주 필터에 가려 오늘 주차가 목록에 없으면 필터를 초기화해서 다시 노출
            if (!weekAvailableWithCurrentFilters(targetWeek) && (managerEl.value || vendorEl.value)) {
                managerEl.value = '';
                vendorEl.value  = '';
                updateLinkedFilters();
                showToast('담당자/외주 필터를 초기화하고 오늘 주차로 이동했어요');
            }

            if (weekEl.value !== targetWeek) {
                weekEl.value = targetWeek;
                clearOverviewReturnWeek();
                updateLinkedFilters();
            }

            applyFilters();
            scrollToToday();
        }

        document.getElementById('prevWeekBtn').addEventListener('click', () => { clearOverviewReturnWeek(); shiftWeek(-1); });
        document.getElementById('nextWeekBtn').addEventListener('click', () => { clearOverviewReturnWeek(); shiftWeek(1); });

        // 카드보기에서 "오늘" 버튼: 오늘 주차로 이동 후 오늘 날짜 카드로 스크롤
        document.getElementById('goToTodayBtn').addEventListener('click', () => {
            goToToday();
        });

        // 주간 전체보기 진입/이탈 시 body에 클래스를 토글하여
        // 헤더/필터/통계 등 나머지 메뉴를 숨기고 일정 보드가 화면을 꽉 채우게 함
        function setOverviewFullscreen(active) {
            document.body.classList.toggle('overview-fullscreen', active);
        }

        function setActiveViewButton(mode) {
            document.querySelectorAll('.view-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === mode);
            });
        }

        // 카드보기 / 주간 전체보기 전환
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) return;

                clearOverviewReturnWeek();

                viewMode = btn.dataset.view;
                setActiveViewButton(viewMode);
                setOverviewFullscreen(viewMode === 'overview');

                if (viewMode === 'overview') {
                    ensureWeekSelectedForOverview();
                }

                applyFilters();
                updateFloatingOverviewBtn();
            });
        });

        // 전체보기 상단바: 카드보기로 복귀
        document.getElementById('obExitBtn').addEventListener('click', () => {
            clearOverviewReturnWeek();
            viewMode = 'card';
            setActiveViewButton('card');
            setOverviewFullscreen(false);
            applyFilters();
            updateFloatingOverviewBtn();
        });

        // 전체보기 상단바: 전주/차주 이동 (기존 shiftWeek 재사용)
        document.getElementById('obPrevBtn').addEventListener('click', () => { clearOverviewReturnWeek(); shiftWeek(-1); });
        document.getElementById('obNextBtn').addEventListener('click', () => { clearOverviewReturnWeek(); shiftWeek(1); });

        // 카드보기에서 항상 표시되는 "전체보기" 버튼 → 주간 전체보기로 이동
        document.getElementById('returnToOverviewBtn').addEventListener('click', () => {
            returnToOverview();
        });

        // 초기화 - 페이지 로딩 시 자동으로 GitHub에서 파일 로드
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('scheduleGrid').innerHTML = `
                <div class="no-data">
                    <div class="no-data-icon">⏳</div>
                    <div class="no-data-text">데이터를 불러오는 중...</div>
                </div>
            `;
            loadExcelFromGitHub();
        });

        /* ===== A/S 레포트 기능 (등록 · 작성 · 고객확인 서명 · 미리보기) =====
           저장: 이 기기의 localStorage('asr_reports_v1'). 다른 기기와 공유하려면 별도 저장소가 필요함. */
        (function () {
            'use strict';
            var KEY = 'asr_reports_v1';
            var S = { reports: {}, lastName: '' };
            try { var raw = localStorage.getItem(KEY); if (raw) { var p = JSON.parse(raw); if (p && p.reports) S = p; } } catch (e) {}
            function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { toast('저장 공간이 부족합니다'); } }
            var $ = function (id) { return document.getElementById(id); };
            function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
            function pad2(n) { return n < 10 ? '0' + n : '' + n; }
            function today() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
            function toast(t) { var el = $('rpToast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { el.hidden = true; }, 2200); }

            /* ----- 일정 ↔ 레포트 연결 ----- */
            function sch(uid) { return allSchedules.filter(function (s) { return String(s._uid) === String(uid); })[0]; }
            function rkey(s) { return [s.일자, s.구분, s.호선, s.장비].join('|'); }
            function prefill(s) {
                var loc = String(s.조선소_장소 || '');
                return {
                    customer: loc.split(/[\r\n\/]+/)[0].trim(),
                    hull: String(s.호선 || '').trim(),
                    equip: String(s.장비 || '').trim(),
                    place: loc.replace(/\s*[\r\n]+\s*/g, ' ').trim(),
                    reqDate: s.일자 || '',
                    cls: String(s.구분 || '').trim(),
                    request: String(s.검사종류_고객요청사항 || '').trim()
                };
            }
            function status(r) {
                if (!r || !r.reg) return ['none', '미등록'];
                if (r.confirm && r.confirm.sig) return ['done', '확인 완료'];
                if (r.written) return ['await', '고객확인 대기'];
                if (r.onsite || r.action) return ['draft', '작성 중'];
                return ['reg', '접수 등록'];
            }
            function getR(key) { return S.reports[key] || (S.reports[key] = {}); }

            /* ----- 카드 하단 레포트 줄 ----- */
            window.rpRow = function (s) {
                var r = S.reports[rkey(s)], st = status(r), u = s._uid;
                return '<div class="rp-row" data-rp-uid="' + u + '"><span class="rp-label">레포트</span><span class="rp-pill ' + st[0] + '">' + st[1] + '</span><span class="rp-acts">' +
                    (r && r.reg ? '<button type="button" class="rp-btn" data-rp-act="view" data-rp-uid="' + u + '">보기</button>' : '') +
                    '<button type="button" class="rp-btn" data-rp-act="reg" data-rp-uid="' + u + '">등록</button>' +
                    '<button type="button" class="rp-btn pri" data-rp-act="write" data-rp-uid="' + u + '">작성</button></span></div>';
            };
            function refreshRow(uid) {
                var el = document.querySelector('.schedule-card[data-uid="' + uid + '"] .rp-row'), s = sch(uid);
                if (el && s) el.outerHTML = window.rpRow(s);
            }
            document.addEventListener('click', function (e) {
                var b = e.target.closest('[data-rp-act]');
                if (b) {
                    var uid = b.getAttribute('data-rp-uid'), a = b.getAttribute('data-rp-act');
                    if (a === 'reg') openReg(uid); else if (a === 'write') openWrite(uid); else if (a === 'view') openPreview(uid);
                    return;
                }
                var c = e.target.closest('[data-rp-close]');
                if (c) closeSheet(c.getAttribute('data-rp-close'));
            });
            var curUid = null;
            function openSheet(id) { $(id).hidden = false; document.body.classList.add('rp-open'); }
            function closeSheet(id) {
                $(id).hidden = true;
                var any = ['rpRegSheet', 'rpWrSheet', 'rpSignSheet', 'rpPvSheet'].some(function (x) { return !$(x).hidden; });
                if (!any) document.body.classList.remove('rp-open');
                if (curUid != null) refreshRow(curUid);
            }

            /* ----- 등록 (PDF) ----- */
            var REG_FIELDS = [['customer', '상호', 'CUSTOMER'], ['hull', '호선', 'HULL NO.'], ['dept_name', '부서명/성명', 'DEP./NAME'], ['equip', '장비명', 'EQUIPMENT'], ['tel', '연락처', 'TEL'], ['receiptNo', '접수번호', 'RECEIPT NO.'], ['cls', 'A/S구분', 'CLASS'], ['receiver', '접수자', 'RECEIVER'], ['reqDate', '고객요청일자', 'DATE'], ['place', '장소', 'PLACE']];
            var reg = { uid: null, key: '', data: {}, fileName: '' };
            function openReg(uid) {
                var s = sch(uid); if (!s) return;
                curUid = uid;
                var old = S.reports[rkey(s)];
                reg = { uid: uid, key: rkey(s), data: old && old.reg ? JSON.parse(JSON.stringify(old.reg)) : prefill(s), fileName: (old && old.fileName) || '' };
                $('rpRegTitle').textContent = '레포트 등록 · ' + (s.호선 || s.장비 || '');
                drawReg('');
                openSheet('rpRegSheet');
            }
            function drawReg(msg) {
                var h = '<div class="rp-drop" id="rpDrop"><b>PC에서 접수부가 입력된 PDF 선택</b>' +
                    '<p class="rp-hint">AFTER SALES SERVICE REPORT 양식의 접수부·고객요청사항을 읽어옵니다.</p>' +
                    '<input id="rpPdfIn" type="file" accept="application/pdf,.pdf" hidden>' +
                    '<button class="rp-big pri" type="button" id="rpPickPdf">PDF 파일 선택</button>' +
                    '<button class="rp-btn" type="button" id="rpFillSch">일정 정보로 채우기</button></div>';
                if (reg.fileName) h += '<p class="rp-hint">선택한 파일: <b>' + esc(reg.fileName) + '</b></p>';
                if (msg) h += '<p class="rp-hint">' + esc(msg) + '</p>';
                h += '<div class="rp-grid2">' + REG_FIELDS.map(function (f) {
                    return '<div class="rp-field"><label for="rpf_' + f[0] + '">' + f[1] + '<small>' + f[2] + '</small></label><input type="text" id="rpf_' + f[0] + '" data-k="' + f[0] + '" value="' + esc(reg.data[f[0]] || '') + '"></div>';
                }).join('') + '</div>' +
                    '<div class="rp-field"><label for="rpf_request">고객요청사항<small>REQUEST</small></label><textarea id="rpf_request" data-k="request" style="min-height:22vh;min-height:22dvh">' + esc(reg.data.request || '') + '</textarea></div>' +
                    '<p class="rp-hint">PDF 자동 인식 결과는 틀릴 수 있습니다. 등록 전에 확인하고 고쳐 주세요.</p>';
                $('rpRegBody').innerHTML = h;
                var drop = $('rpDrop'), inp = $('rpPdfIn');
                $('rpPickPdf').onclick = function () { inp.click(); };
                inp.onchange = function () { if (inp.files[0]) handlePdf(inp.files[0]); };
                ['dragenter', 'dragover'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add('over'); }); });
                ['dragleave', 'drop'].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove('over'); }); });
                drop.addEventListener('drop', function (e) { var f = e.dataTransfer && e.dataTransfer.files[0]; if (f) handlePdf(f); });
                $('rpFillSch').onclick = function () { reg.data = prefill(sch(reg.uid)); drawReg('일정 정보로 채웠습니다.'); };
            }
            $('rpRegBody').addEventListener('input', function (e) { var k = e.target.getAttribute && e.target.getAttribute('data-k'); if (k) reg.data[k] = e.target.value; });

            var pdfLoading = null, CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
            function loadPdfJs() {
                if (window.pdfjsLib) return Promise.resolve();
                if (pdfLoading) return pdfLoading;
                pdfLoading = new Promise(function (res, rej) {
                    var s = document.createElement('script');
                    s.src = CDN + 'pdf.min.js';
                    s.onload = function () {
                        fetch(CDN + 'pdf.worker.min.js').then(function (r) { return r.text(); }).then(function (t) {
                            window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([t], { type: 'text/javascript' }));
                        }).catch(function () { window.pdfjsLib.GlobalWorkerOptions.workerSrc = CDN + 'pdf.worker.min.js'; }).then(res);
                    };
                    s.onerror = function () { pdfLoading = null; rej(new Error('load')); };
                    document.head.appendChild(s);
                });
                return pdfLoading;
            }
            var NOISE = /\(?\s*(CUSTOMER|HULL NO\.?|DEP\.?|NAME OF EQUIPMENT|NAME|TELEPHONE NUMBER|NUMBER OF RECEIPT|CLASSIFICATION OF A\/S|OF RECEIPT|DATE OF SERVICE|PLACE OF SERVICE)\s*\)?/gi;
            var LABELS = [['customer', '상호'], ['hull', '호선'], ['dept_name', '부서명'], ['equip', '장비명'], ['tel', '연락처'], ['receiptNo', '접수번호'], ['cls', 'A/S구분'], ['receiver', '접수자'], ['reqDate', '고객요청일자'], ['place', '장소']];
            function extract(items) {
                var out = {}, labelItems = [];
                items.forEach(function (it) {
                    LABELS.forEach(function (L) {
                        if (it.s.indexOf(L[1]) === 0 && !it.isLabel) { it.isLabel = true; it.key = L[0]; it.rest = it.s.slice(L[1].length).replace(/^[\s\/]*(성명)?/, '').trim(); labelItems.push(it); }
                    });
                });
                labelItems.forEach(function (L) {
                    var next = Infinity;
                    labelItems.forEach(function (o) { if (o !== L && Math.abs(o.y - L.y) <= 14 && o.x > L.x && o.x < next) next = o.x; });
                    var vals = items.filter(function (i) { return !i.isLabel && Math.abs(i.y - L.y) <= 14 && i.x > L.x + 8 && i.x < next; }).sort(function (a, b) { return a.x - b.x; }).map(function (i) { return i.s; });
                    if (L.rest) vals.unshift(L.rest);
                    var v = vals.join(' ').trim();
                    if (v) out[L.key] = v;
                });
                var rd = labelItems.filter(function (l) { return l.key === 'reqDate'; })[0];
                var sec = items.filter(function (i) { return i.s.charAt(0) === '현' && i.x < 90; })[0];
                if (rd) {
                    var lines = {};
                    items.forEach(function (i) {
                        if (i.isLabel || i.x <= 74 || i.y >= rd.y - 12) return;
                        if (sec && i.y <= sec.y) return;
                        var k = Math.round(i.y / 3); (lines[k] = lines[k] || []).push(i);
                    });
                    var txt = Object.keys(lines).map(Number).sort(function (a, b) { return b - a; }).map(function (k) { return lines[k].sort(function (a, b) { return a.x - b.x; }).map(function (i) { return i.s; }).join(' '); }).join('\n').trim();
                    if (txt && !/^\(?REQUEST\)?$/i.test(txt)) out.request = txt;
                }
                return out;
            }
            async function handlePdf(file) {
                if (!/\.pdf$/i.test(file.name) && file.type !== 'application/pdf') { drawReg('PDF 파일만 올릴 수 있습니다.'); return; }
                reg.fileName = file.name;
                drawReg('PDF를 읽는 중입니다…');
                try {
                    await loadPdfJs();
                    var pdf = await window.pdfjsLib.getDocument({ data: await file.arrayBuffer(), cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/cmaps/', cMapPacked: true }).promise;
                    var page = await pdf.getPage(1), tc = await page.getTextContent();
                    var items = tc.items.map(function (i) { return { s: i.str.replace(NOISE, '').replace(/^\/\s*성명$/, '').trim(), x: i.transform[4], y: i.transform[5] }; }).filter(function (i) { return i.s; });
                    var d = extract(items), n = Object.keys(d).length, base = prefill(sch(reg.uid));
                    Object.keys(d).forEach(function (k) { base[k] = d[k]; });
                    reg.data = base;
                    drawReg(n > 2 ? '접수부·고객요청사항 ' + n + '개 항목을 읽었습니다. 내용을 확인해 주세요.' : 'PDF에서 읽은 항목이 적어 일정 정보로 채웠습니다. 직접 확인해 주세요.');
                } catch (err) {
                    reg.data = prefill(sch(reg.uid));
                    drawReg('PDF를 자동으로 읽지 못했습니다. 일정 정보로 채웠으니 직접 확인해 주세요.');
                }
            }
            $('rpRegSave').addEventListener('click', function () {
                var r = getR(reg.key); r.reg = reg.data; r.fileName = reg.fileName; save();
                closeSheet('rpRegSheet'); toast('레포트를 등록했습니다');
            });

            /* ----- 작성 (모바일 입력) ----- */
            var W = { uid: null, key: '', step: 1 };
            function openWrite(uid) {
                var s = sch(uid); if (!s) return;
                curUid = uid;
                var r = getR(rkey(s));
                if (!r.reg) r.reg = prefill(s);
                if (!r.name) r.name = S.lastName || '';
                W = { uid: uid, key: rkey(s), step: r.written ? 4 : 1 };
                openSheet('rpWrSheet'); drawWrite();
            }
            function drawWrite() {
                var r = S.reports[W.key], s = sch(W.uid), st = W.step;
                $('rpWrTitle').textContent = (s.호선 || '') + ' · ' + (s.장비 || '');
                $('rpWrSteps').innerHTML = [1, 2, 3].map(function (n) { return '<i class="' + (st >= n ? 'on' : '') + '"></i>'; }).join('');
                $('rpWrSteps').style.visibility = st === 4 ? 'hidden' : 'visible';
                var reqBox = '<div class="rp-box"><h3>고객요청사항</h3><p>' + (esc(r.reg.request) || '<span class="rp-hint">등록된 요청사항이 없습니다.</span>') + '</p></div>';
                var body = '', foot = '';
                if (st === 1) {
                    body = reqBox + '<div class="rp-field"><label for="rpOnsite">① 현장분석<small>ON-SITE ANALYSIS</small></label><textarea id="rpOnsite" placeholder="확인한 현장 상태와 원인을 적어 주세요">' + esc(r.onsite || '') + '</textarea></div>';
                    foot = '<button class="rp-big pri" type="button" data-go="2">다음 · 조치내용</button>';
                } else if (st === 2) {
                    body = '<div class="rp-field"><label for="rpAction">② 조치내용<small>A/S RESULT</small></label><textarea id="rpAction" placeholder="수행한 조치를 적어 주세요">' + esc(r.action || '') + '</textarea></div>' +
                        '<div class="rp-field"><span class="rp-lab">진행 상태</span><div class="rp-seg" id="rpStSeg">' +
                        [['finished', '완료'], ['unfinished', '미완료'], ['revisit', '재방문']].map(function (o) { return '<button type="button" data-v="' + o[0] + '" aria-pressed="' + (r.state === o[0]) + '">' + o[1] + '</button>'; }).join('') + '</div></div>';
                    foot = '<button class="rp-big" type="button" data-go="1">이전</button><button class="rp-big pri" type="button" data-go="3">다음 · 서명자</button>';
                } else if (st === 3) {
                    body = '<div class="rp-field"><label for="rpWName">③ NAME<small>작업자 성명</small></label><input id="rpWName" type="text" value="' + esc(r.name || '') + '" placeholder="성명" autocomplete="name"></div>' +
                        '<div class="rp-field"><label for="rpWDate">DATE<small>오늘 날짜 자동 입력 · 수정 가능</small></label><input id="rpWDate" type="date" value="' + esc(r.workDate || today()) + '"></div>' +
                        '<p class="rp-hint">저장하면 고객확인을 따로 받을 수 있습니다.</p>';
                    foot = '<button class="rp-big" type="button" data-go="2">이전</button><button class="rp-big pri" type="button" id="rpWSave">저장</button>';
                } else {
                    var sg = status(r);
                    body = '<div class="rp-box"><h3>작성 내용</h3><p><b>현장분석</b>\n' + esc(r.onsite || '-') + '\n\n<b>조치내용</b>\n' + esc(r.action || '-') + '</p></div>' +
                        '<p class="rp-hint">작성자 ' + esc(r.name || '-') + ' · ' + esc(r.workDate || today()) + ' · 상태 <span class="rp-pill ' + sg[0] + '">' + sg[1] + '</span></p>' +
                        '<div class="rp-actions"><button class="rp-big pri" type="button" id="rpGoConfirm">' + (r.confirm && r.confirm.sig ? '고객확인 다시 받기' : '고객확인 받기') + '</button><button class="rp-big" type="button" id="rpGoPreview">양식 미리보기</button><button class="rp-big" type="button" data-go="1">내용 수정</button></div>';
                }
                $('rpWrBody').innerHTML = body; $('rpWrFoot').innerHTML = foot;
                $('rpWrFoot').style.display = foot ? 'flex' : 'none';
                $('rpWrSheet').querySelector('.rp-main').scrollTop = 0;
            }
            $('rpWrBody').addEventListener('input', function (e) {
                var r = S.reports[W.key]; if (!r) return;
                if (e.target.id === 'rpOnsite') r.onsite = e.target.value;
                else if (e.target.id === 'rpAction') r.action = e.target.value;
                else if (e.target.id === 'rpWName') r.name = e.target.value;
                else if (e.target.id === 'rpWDate') r.workDate = e.target.value;
                save();
            });
            $('rpWrBody').addEventListener('click', function (e) {
                var seg = e.target.closest('#rpStSeg button');
                if (seg) { S.reports[W.key].state = seg.getAttribute('data-v'); save(); $('rpStSeg').querySelectorAll('button').forEach(function (b) { b.setAttribute('aria-pressed', String(b === seg)); }); return; }
                var g = e.target.closest('[data-go]'); if (g) { W.step = +g.getAttribute('data-go'); drawWrite(); return; }
                if (e.target.id === 'rpGoConfirm') openSign();
                if (e.target.id === 'rpGoPreview') openPreview(W.uid);
            });
            $('rpWrFoot').addEventListener('click', function (e) {
                var g = e.target.closest('[data-go]');
                if (g) { W.step = +g.getAttribute('data-go'); drawWrite(); return; }
                if (e.target.id === 'rpWSave') {
                    var r = S.reports[W.key];
                    if (!r.state) r.state = 'finished';
                    r.written = true; r.workDate = ($('rpWDate') && $('rpWDate').value) || r.workDate || today(); S.lastName = r.name || S.lastName; save();
                    W.step = 4; drawWrite(); toast('작성 내용을 저장했습니다');
                }
            });

            /* ----- 고객확인 서명 (가로 전체화면) ----- */
            var cv = $('rpPadCv'), ctx = cv.getContext('2d'), strokes = [], cur = null, sat = null;
            var portraitMq = window.matchMedia('(orientation: portrait)');
            function syncOrient() { $('rpSignSheet').classList.toggle('portrait', portraitMq.matches); if (!$('rpSignSheet').hidden) setTimeout(fitPad, 50); }
            if (portraitMq.addEventListener) portraitMq.addEventListener('change', syncOrient); else if (portraitMq.addListener) portraitMq.addListener(syncOrient);
            window.addEventListener('resize', function () { if (!$('rpSignSheet').hidden) fitPad(); if (!$('rpPvSheet').hidden) fitAll(); });
            function fitPad() {
                var r = cv.getBoundingClientRect(), d = window.devicePixelRatio || 1;
                if (!r.width || !r.height) return;
                cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d); redraw();
            }
            function redraw() {
                var w = cv.width, h = cv.height, d = window.devicePixelRatio || 1;
                ctx.clearRect(0, 0, w, h); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#111'; ctx.lineWidth = 2.6 * d;
                strokes.forEach(function (s) {
                    ctx.beginPath();
                    s.forEach(function (p, i) { var x = p[0] * w, y = p[1] * h; if (i === 0) { ctx.moveTo(x, y); ctx.lineTo(x + 0.01, y); } else ctx.lineTo(x, y); });
                    ctx.stroke();
                });
                $('rpPadPh').style.display = strokes.length ? 'none' : 'block';
                updSign();
            }
            function pt(e) { var r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; }
            cv.addEventListener('pointerdown', function (e) { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch (x) {} cur = [pt(e)]; strokes.push(cur); redraw(); });
            cv.addEventListener('pointermove', function (e) { if (!cur) return; e.preventDefault(); cur.push(pt(e)); redraw(); });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { cv.addEventListener(ev, function () { cur = null; }); });
            function exportSig() {
                var w = cv.width, h = cv.height, x0 = 1e9, y0 = 1e9, x1 = -1, y1 = -1;
                strokes.forEach(function (s) { s.forEach(function (p) { var x = p[0] * w, y = p[1] * h; if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }); });
                var bw = Math.max(x1 - x0, 20), bh = Math.max(y1 - y0, 20), k = Math.min(140 / bh, 560 / bw), pad = 8;
                var o = document.createElement('canvas'); o.width = Math.ceil(bw * k + pad * 2); o.height = Math.ceil(bh * k + pad * 2);
                var c = o.getContext('2d'); c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = '#111'; c.lineWidth = 7;
                strokes.forEach(function (s) { c.beginPath(); s.forEach(function (p, i) { var x = (p[0] * w - x0) * k + pad, y = (p[1] * h - y0) * k + pad; if (i === 0) { c.moveTo(x, y); c.lineTo(x + 0.01, y); } else c.lineTo(x, y); }); c.stroke(); });
                return o.toDataURL('image/png');
            }
            function updSign() { $('rpSignDone').disabled = !(strokes.length && sat); }
            $('rpPadClear').addEventListener('click', function () { strokes = []; redraw(); });
            $('rpSatSeg').addEventListener('click', function (e) {
                var b = e.target.closest('button'); if (!b) return; sat = b.getAttribute('data-v');
                $('rpSatSeg').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); }); updSign();
            });
            $('rpForceSign').addEventListener('click', function () { $('rpSignSheet').classList.add('force'); setTimeout(fitPad, 50); });
            function openSign() {
                strokes = []; cur = null; sat = null;
                $('rpSatSeg').querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', 'false'); });
                $('rpCDate').value = today();
                $('rpSignSheet').classList.remove('force');
                openSheet('rpSignSheet'); syncOrient();
                try { if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen().then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(function () {}); }).catch(function () {}); } } catch (e) {}
                setTimeout(fitPad, 60);
            }
            function leaveFs() { try { if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {}); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {} }
            $('rpSignClose').addEventListener('click', function () { leaveFs(); closeSheet('rpSignSheet'); });
            $('rpSignDone').addEventListener('click', function () {
                var r = S.reports[W.key];
                r.confirm = { sat: sat, date: $('rpCDate').value || today(), sig: exportSig() };
                save(); leaveFs(); closeSheet('rpSignSheet'); drawWrite(); toast('고객확인을 받았습니다');
            });

            /* ----- 양식 미리보기 (QSP-601-03 원본 위에 입력값 배치) ----- */
            var PW = 595.32, PH = 841.92;
            function ov(r, html, cls) {
                return '<div class="rp-ov ' + (cls || '') + '" style="left:' + (r[0] / PW * 100).toFixed(3) + '%;top:' + (r[1] / PH * 100).toFixed(3) + '%;width:' + ((r[2] - r[0]) / PW * 100).toFixed(3) + '%;height:' + ((r[3] - r[1]) / PH * 100).toFixed(3) + '%">' + html + '</div>';
            }
            var VL = [178.5, 321], VR = [430.5, 581.2], ROWS = [[92.8, 118.2], [118.2, 144], [144, 169.8], [169.8, 190.6], [190.6, 216.5]];
            var CELLS = { customer: [VL, 0], hull: [VR, 0], dept_name: [VL, 1], equip: [VR, 1], tel: [VL, 2], receiptNo: [VR, 2], cls: [VL, 3], receiver: [VR, 3], reqDate: [VL, 4], place: [VR, 4] };
            var CK = { finished: [81.6, 467.6, 88.8, 476.5], unfinished: [141.4, 467.6, 148.5, 476.5], revisit: [221.8, 467.6, 228.9, 476.5], sat: [367.1, 467.6, 374.2, 476.5], dis: [433.1, 467.6, 440.2, 476.5] };
            function fitAll() {
                document.querySelectorAll('#rpPvBody .rp-ov').forEach(function (el) {
                    if (el.classList.contains('sig') || el.classList.contains('ck')) return;
                    el.style.fontSize = '';
                    var px = parseFloat(getComputedStyle(el).fontSize), n = 0;
                    while ((el.scrollHeight > el.clientHeight + 1 || el.scrollWidth > el.clientWidth + 1) && n < 14) { px *= 0.93; el.style.fontSize = px + 'px'; n++; }
                });
            }
            function openPreview(uid) {
                var s = sch(uid); if (!s) return;
                curUid = uid;
                var r = S.reports[rkey(s)]; if (!r || !r.reg) return;
                var g = r.reg, cf = r.confirm || {}, h = '';
                Object.keys(CELLS).forEach(function (k) {
                    var m = CELLS[k], row = ROWS[m[1]];
                    if (g[k]) h += ov([m[0][0], row[0], m[0][1], row[1]], esc(g[k]));
                });
                h += ov([78, 218, 580, 316], esc(g.request || ''), 'top');
                h += ov([78, 319, 580, 461], esc(r.onsite || ''), 'top');
                h += ov([78, 478, 320, 659], esc(r.action || ''), 'top');
                if (r.state && CK[r.state]) h += ov(CK[r.state], '✔', 'ck');
                if (cf.sat && CK[cf.sat]) h += ov(CK[cf.sat], '✔', 'ck');
                h += ov([119, 661.5, 192, 682], esc(r.workDate || ''));
                h += ov([249, 661.5, 320, 682], esc(r.name || ''));
                h += ov([405, 661.5, 465, 682], esc(cf.date || ''));
                if (cf.sig) h += ov([523, 636, 580, 682], '<img alt="고객 서명" src="' + cf.sig + '">', 'sig');
                $('rpPvTitle').textContent = '양식 미리보기 · ' + (s.호선 || s.장비 || '');
                $('rpPvBody').innerHTML = '<div class="rp-a4box"><div class="rp-pg">' + h + '</div></div>';
                openSheet('rpPvSheet');
                requestAnimationFrame(fitAll);
            }
        })();
    </script>
