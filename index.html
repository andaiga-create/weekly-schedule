                var n = pendingCount(); if (n) t += '\n전송 대기 ' + n + '건';
                return t;
            }
            function refreshAllRows() { document.querySelectorAll('.rp-row').forEach(function (el) { refreshRow(el.getAttribute('data-rp-uid')); }); }
            function syncSoon() { if (!ready()) return; clearTimeout(syncTimer); syncTimer = setTimeout(function () { syncNow(true); }, 1500); }
            async function syncNow(silent) {
                if (!ready()) { if (!silent) openCfg(); return; }
                if (syncing) { syncAgain = true; return; }
                syncing = true; lastErr = ''; setState('sync');
                var pulled = 0, pushed = 0;
                try {
                    for (var a = 0; a < 3; a++) {
                        try { var rt = await remoteTree(); pulled += await pull(rt); pushed += await pushDirty(rt); break; }
                        catch (e) { if ((e.status === 422 || e.status === 409) && a < 2) continue; throw e; }
                    }
                    lastSync = Date.now(); save(); refreshAllRows(); setState('ok');
                    if (!silent) toast('동기화했습니다 · 받음 ' + pulled + ' · 보냄 ' + pushed);
                } catch (e) {
                    lastErr = errText(e); setState('err');
                    if (!silent) toast('동기화 실패: ' + lastErr);
                } finally {
                    syncing = false;
                    if (syncAgain) { syncAgain = false; syncNow(true); }
                }
            }
            async function deleteMonth(month) {
                var rt = await remoteTree(), prefix = 'reports/' + month + '/';
                var paths = rt.files.filter(function (f) { return f.path.indexOf(prefix) === 0; }).map(function (f) { return f.path; });
                if (paths.length) await commitTree(rt, paths.map(function (p) { return { path: p, mode: '100644', type: 'blob', sha: null }; }), 'reports: ' + month + ' 폴더 삭제');
                Object.keys(S.reports).forEach(function (k) { if (pathFor(k).indexOf(prefix) === 0) delete S.reports[k]; });
                paths.forEach(function (p) { delete S.remote[p]; });
                save(); await remoteTree(); refreshAllRows();
            }
            function fmtSize(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; }
            function drawCfg() {
                var months = {};
                (lastTree ? lastTree.files : []).forEach(function (f) { var m = f.path.split('/')[1]; (months[m] = months[m] || { n: 0, b: 0 }); months[m].n++; months[m].b += f.size; });
                var ms = Object.keys(months).sort().reverse();
                var h = '<div class="rp-box"><h3>연결 상태</h3><p id="rpCfgState">' + esc(stateText()) + '</p></div>' +
                    '<div class="rp-grid2"><div class="rp-field"><label for="rpcOwner">소유자<small>OWNER</small></label><input id="rpcOwner" type="text" autocapitalize="off" autocomplete="off" value="' + esc(cfg.owner) + '"></div>' +
                    '<div class="rp-field"><label for="rpcRepo">저장소<small>REPOSITORY</small></label><input id="rpcRepo" type="text" autocapitalize="off" autocomplete="off" value="' + esc(cfg.repo) + '"></div></div>' +
                    '<div class="rp-field"><label for="rpcBranch">브랜치<small>BRANCH</small></label><input id="rpcBranch" type="text" autocapitalize="off" autocomplete="off" value="' + esc(cfg.branch) + '"></div>' +
                    '<div class="rp-field"><label for="rpcToken">접근 토큰<small>TOKEN</small></label><input id="rpcToken" type="password" autocapitalize="off" autocomplete="new-password" placeholder="' + (cfg.token ? '저장됨 (바꾸려면 새로 입력)' : 'github_pat_…') + '"></div>' +
                    '<p class="rp-hint">이 저장소만 선택한 Fine-grained 토큰에 Contents 읽기/쓰기 권한을 주면 됩니다. 토큰은 이 기기의 브라우저에만 저장되고, 기기마다 한 번씩 입력합니다. 브랜치를 새 이름(예: reports)으로 쓰면 index.html을 올릴 때 git pull 충돌이 생기지 않습니다.</p>' +
                    '<div class="rp-box"><h3>저장된 레포트 폴더 (reports/)</h3>' +
                    (ms.length ? ms.map(function (m) { return '<div class="rp-month"><span><b>' + esc(m) + '</b> · ' + months[m].n + '건 · ' + fmtSize(months[m].b) + '</span><button type="button" class="rp-btn" data-rp-del="' + esc(m) + '">삭제</button></div>'; }).join('') : '<p class="rp-hint">' + (ready() ? '저장된 레포트가 없습니다.' : '연결하면 월별 폴더가 여기에 표시됩니다.') + '</p>') +
                    '<p class="rp-hint" style="margin-top:8px">삭제하면 저장소의 해당 월 폴더와 이 기기의 같은 달 레포트가 지워집니다. git 기록에는 이전 내용이 남아 있어 저장소 용량은 바로 줄지 않습니다.</p></div>' +
                    (cfg.token ? '<button class="rp-btn" type="button" id="rpCfgOff" style="align-self:flex-start">연결 해제 (이 기기의 토큰 삭제)</button>' : '');
                $('rpCfgBody').innerHTML = h;
            }
            function openCfg() {
                drawCfg(); openSheet('rpCfgSheet');
                if (ready()) remoteTree().then(function () { if (!$('rpCfgSheet').hidden) drawCfg(); }).catch(function (e) { lastErr = errText(e); if (!$('rpCfgSheet').hidden) { drawCfg(); } });
            }
            $('rpSyncBtn').addEventListener('click', openCfg);
            $('rpCfgSave').addEventListener('click', function () {
                var v = function (id) { return ($(id).value || '').trim(); };
                cfg.owner = v('rpcOwner'); cfg.repo = v('rpcRepo'); cfg.branch = v('rpcBranch') || 'main';
                if (v('rpcToken')) cfg.token = v('rpcToken');
                saveCfg();
                if (!ready()) { toast('소유자·저장소·토큰을 모두 입력해 주세요'); setState('off'); return; }
                closeSheet('rpCfgSheet'); syncNow(false);
            });
            $('rpCfgBody').addEventListener('click', function (e) {
                if (e.target.id === 'rpCfgOff') { cfg.token = ''; saveCfg(); lastErr = ''; lastTree = null; setState('off'); drawCfg(); toast('연결을 해제했습니다'); return; }
                var d = e.target.closest('[data-rp-del]'); if (!d) return;
                if (!d.getAttribute('data-armed')) {
                    d.setAttribute('data-armed', '1'); d.textContent = '한 번 더 누르면 삭제';
                    setTimeout(function () { if (d.isConnected) { d.removeAttribute('data-armed'); d.textContent = '삭제'; } }, 4000);
                    return;
                }
                d.disabled = true; d.textContent = '삭제 중…';
                deleteMonth(d.getAttribute('data-rp-del')).then(function () { toast('폴더를 삭제했습니다'); drawCfg(); }).catch(function (er) { toast('삭제 실패: ' + errText(er)); drawCfg(); });
            });
            setState(ready() ? 'idle' : 'off');
            if (ready()) setTimeout(function () { syncNow(true); }, 1500);
        })();
