<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AS & CLAIM 주간 스케줄 (2026)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 40px;
            border-bottom: 4px solid #ffd700;
        }

        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 40px;
            border-bottom: 4px solid #ffd700;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .filters {
            background: #f8f9fa;
            padding: 25px 40px;
            border-bottom: 2px solid #e9ecef;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .filter-group select {
            padding: 10px 16px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            min-width: 200px;
            background: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-group select:hover {
            border-color: #667eea;
        }

        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* 카드보기 / 전체보기 토글 버튼 */
        .view-toggle {
            display: flex;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
            height: 42px;
        }

        .view-btn {
            flex: 1;
            padding: 0 18px;
            border: none;
            background: white;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #495057;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .view-btn + .view-btn {
            border-left: 2px solid #dee2e6;
        }

        .view-btn:hover {
            background: #f1f3f5;
        }

        .view-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        /* 항상 화면에 떠 있는 전주/차주 네비게이션 */
        .floating-week-nav {
            position: fixed;
            right: 30px;
            bottom: 30px;
            /* iOS Safari 하단 툴바에 가려지지 않도록 safe-area 보정 */
            bottom: calc(30px + env(safe-area-inset-bottom, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            background: white;
            padding: 10px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            z-index: 2147483647;
            -webkit-transform: translateZ(0);
            transform: translateZ(0);
        }

        .float-nav-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            width: 64px;
            padding: 12px 8px;
            border: none;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            color: white;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .float-nav-btn .arrow {
            font-size: 16px;
            line-height: 1;
        }

        .float-nav-btn:hover {
            box-shadow: 0 4px 14px rgba(102, 126, 234, 0.45);
            transform: translateY(-2px);
        }

        .float-nav-btn:active {
            transform: translateY(0);
        }

        .float-week-label {
            font-size: 13px;
            font-weight: 700;
            color: #495057;
            padding: 4px 0;
            width: 64px;
            text-align: center;
            border-top: 1px solid #e9ecef;
            border-bottom: 1px solid #e9ecef;
        }

        /* 전주/차주 경계 도달 시 표시되는 알림 토스트 */
        .week-toast {
            position: fixed;
            left: 50%;
            bottom: 40px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(33, 37, 41, 0.92);
            color: white;
            padding: 12px 22px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            white-space: nowrap;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            z-index: 2147483647;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .week-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 768px) {
            .week-toast {
                bottom: 90px;
                font-size: 13px;
                padding: 10px 16px;
                max-width: 80vw;
                white-space: normal;
                text-align: center;
            }

            .floating-week-nav {
                right: 16px;
                bottom: 16px;
                bottom: calc(16px + env(safe-area-inset-bottom, 0px));
                padding: 8px;
            }

            .float-nav-btn {
                width: 54px;
                padding: 10px 6px;
                font-size: 11px;
            }

            .float-week-label {
                width: 54px;
                font-size: 12px;
            }
        }

        .stats {
            background: white;
            padding: 20px 40px;
            display: flex;
            gap: 30px;
            border-bottom: 1px solid #e9ecef;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        .stat-icon.total {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .stat-icon.week {
            background: linear-gradient(135deg, #f093fb, #f5576c);
        }

        .stat-text {
            display: flex;
            flex-direction: column;
        }

        .stat-label {
            font-size: 12px;
            color: #6c757d;
            font-weight: 500;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #212529;
        }

        .content {
            padding: 40px;
        }

        .week-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .week-title {
            font-size: 24px;
            font-weight: 700;
        }

        .week-range {
            font-size: 14px;
            opacity: 0.9;
        }

        .schedule-grid {
            display: grid;
            gap: 20px;
        }

        .schedule-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .schedule-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(180deg, #667eea 0%, #764ba2 100%);
        }

        .schedule-card:hover {
            border-color: #667eea;
            box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 20px;
            padding-bottom: 16px;
            border-bottom: 1px solid #e9ecef;
        }

        .card-date {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .date-main {
            font-size: 20px;
            font-weight: 700;
            color: #212529;
        }

        .date-week {
            font-size: 12px;
            color: #6c757d;
            font-weight: 500;
        }

        .card-badges {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge.as {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge.claim {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .badge.naeso {
            background: #fff8e1;
            color: #f9a825;
        }

        .badge.default {
            background: #eceff1;
            color: #455a64;
        }

        .badge.free {
            background: #e8f5e9;
            color: #388e3c;
        }

        .badge.paid {
            background: #fff3e0;
            color: #f57c00;
        }

        .card-body {
            display: grid;
            gap: 16px;
        }

        .info-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            align-items: start;
        }

        .info-label {
            font-size: 13px;
            font-weight: 600;
            color: #6c757d;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .info-label::before {
            content: '';
            width: 4px;
            height: 4px;
            background: #667eea;
            border-radius: 50%;
        }

        .info-value {
            font-size: 14px;
            color: #212529;
            line-height: 1.6;
        }

        .info-value.highlight {
            font-weight: 600;
            color: #667eea;
        }

        .no-data {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        .no-data-icon {
            font-size: 64px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .no-data-text {
            font-size: 18px;
            font-weight: 500;
        }

        /* ===== 주간 전체보기 (가로 보드) ===== */
        .overview-board {
            display: flex;
            gap: 12px;
            align-items: stretch;
            overflow-x: auto;
            padding-bottom: 6px;
        }

        .overview-day {
            flex: 1 1 0;
            min-width: 150px;
            background: #f8f9fa;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .overview-day.today {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .overview-day-header {
            padding: 10px 8px;
            text-align: center;
            background: white;
            border-bottom: 2px solid #e9ecef;
        }

        .overview-day.today .overview-day-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .overview-day-date {
            font-size: 15px;
            font-weight: 700;
            color: #212529;
        }

        .overview-day.today .overview-day-date {
            color: white;
        }

        .overview-day-weekday {
            font-size: 12px;
            color: #868e96;
            margin-left: 4px;
        }

        .overview-day.today .overview-day-weekday {
            color: rgba(255, 255, 255, 0.85);
        }

        .overview-day.weekend .overview-day-date,
        .overview-day.weekend .overview-day-weekday {
            color: #e03131;
        }

        .overview-day.today.weekend .overview-day-date,
        .overview-day.today.weekend .overview-day-weekday {
            color: white;
        }

        .overview-day-count {
            font-size: 11px;
            color: #667eea;
            font-weight: 700;
            margin-top: 2px;
        }

        .overview-day.today .overview-day-count {
            color: rgba(255, 255, 255, 0.9);
        }

        .overview-day-body {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* 하루 일정이 많아도 보드 전체 높이는 일정하게 유지하고,
               해당 요일 칸 안에서만 스크롤되게 하여 화면 전체 스크롤을 최소화 */
            max-height: 560px;
            overflow-y: auto;
        }

        .overview-empty {
            text-align: center;
            color: #adb5bd;
            font-size: 12px;
            padding: 24px 4px;
        }

        .overview-item {
            background: white;
            border: 1px solid #e9ecef;
            border-left: 4px solid #667eea;
            border-radius: 8px;
            padding: 10px;
            font-size: 12px;
            line-height: 1.5;
        }

        .overview-item.claim {
            border-left-color: #7b1fa2;
        }

        .overview-item.naeso {
            border-left-color: #f9a825;
        }

        .overview-item-top {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-bottom: 6px;
        }

        .overview-item .badge {
            padding: 3px 7px;
            font-size: 10px;
        }

        .overview-item-place {
            font-weight: 700;
            color: #212529;
            margin-bottom: 2px;
        }

        .overview-item-sub {
            color: #6c757d;
            margin-bottom: 6px;
        }

        /* 외주 정보를 한눈에 들어오도록 강조 배지 처리 */
        .overview-vendor {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: #fff8e1;
            color: #e65100;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            margin-bottom: 4px;
            max-width: 100%;
        }

        .overview-item-manager {
            color: #495057;
            font-size: 11px;
        }

        @media (max-width: 768px) {
            .overview-board {
                gap: 8px;
            }

            .overview-day {
                min-width: 130px;
            }

            .overview-day-body {
                max-height: 420px;
            }
        }

        /* ===== 주간 전체보기 상단 미니바 (기본은 숨김) ===== */
        .overview-topbar {
            display: none;
            position: sticky;
            top: 0;
            z-index: 50;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: white;
            padding: 10px 16px;
            border-bottom: 2px solid #e9ecef;
        }

        .ob-exit-btn {
            padding: 8px 14px;
            border: none;
            border-radius: 8px;
            background: #eceff1;
            color: #37474f;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s ease;
        }

        .ob-exit-btn:hover {
            background: #dfe3e6;
        }

        .ob-week-label {
            font-weight: 700;
            font-size: 14px;
            color: #212529;
            text-align: center;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .ob-nav {
            display: flex;
            gap: 6px;
            flex-shrink: 0;
        }

        .ob-nav-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 700;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: opacity 0.2s ease;
        }

        .ob-nav-btn:hover {
            opacity: 0.85;
        }

        /* 주간 전체보기 활성화 시: 헤더/필터/통계/주차타이틀 등 메뉴 전부 숨기고
           일정 보드가 화면을 꽉 채우도록 전환 */
        body.overview-fullscreen {
            padding: 0;
        }

        body.overview-fullscreen .container {
            max-width: 100%;
            border-radius: 0;
            box-shadow: none;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        body.overview-fullscreen .header,
        body.overview-fullscreen .filters,
        body.overview-fullscreen .stats,
        body.overview-fullscreen .week-header {
            display: none !important;
        }

        body.overview-fullscreen .overview-topbar {
            display: flex;
        }

        body.overview-fullscreen .content {
            padding: 8px;
            flex: 1;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        body.overview-fullscreen #scheduleGrid {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-height: 0;
        }

        body.overview-fullscreen .overview-board {
            flex: 1;
            min-height: 0;
            height: auto;
        }

        body.overview-fullscreen .overview-day {
            height: 100%;
        }

        body.overview-fullscreen .overview-day-body {
            flex: 1;
            min-height: 0;
            max-height: none;
        }

        /* 전체보기에서는 상단바에 이미 전주/차주 버튼이 있으므로
           화면을 가리는 플로팅 버튼은 숨김 */
        body.overview-fullscreen .floating-week-nav {
            display: none;
        }

        @media (max-width: 768px) {
            .overview-topbar {
                padding: 8px 10px;
            }

            .ob-exit-btn {
                padding: 7px 10px;
                font-size: 12px;
            }

            .ob-week-label {
                font-size: 12px;
            }

            .ob-nav-btn {
                padding: 7px 9px;
                font-size: 11px;
            }
        }

        @media (max-width: 768px) {
            .filters {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group select {
                min-width: 100%;
            }

            .view-toggle {
                width: 100%;
            }

            .stats {
                gap: 20px;
                padding: 16px 18px;
            }

            .stat-icon {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            .stat-value {
                font-size: 20px;
            }

            .info-row {
                grid-template-columns: 1fr;
                gap: 6px;
            }

            .header h1 {
                font-size: clamp(18px, 5.6vw, 22px);
                white-space: nowrap;
                letter-spacing: -0.4px;
            }

            .header {
                padding: 14px 16px;
            }
        }

        @keyframes highlight {
            0%, 100% {
                box-shadow: 0 8px 24px rgba(102, 126, 234, 0.2);
                transform: translateY(0);
            }
            50% {
                box-shadow: 0 12px 32px rgba(102, 126, 234, 0.4);
                transform: translateY(-4px);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ AS & CLAIM 주간 스케줄</h1>
        </div>

        <div class="filters">
            <div class="filter-group">
                <label>📅 주차 선택</label>
                <select id="weekFilter">
                    <option value="">전체 주차</option>
                </select>
            </div>
            <div class="filter-group">
                <label>👤 담당자</label>
                <select id="managerFilter">
                    <option value="">전체 담당자</option>
                </select>
            </div>
            <div class="filter-group">
                <label>🏭 외주</label>
                <select id="vendorFilter">
                    <option value="">전체 외주</option>
                </select>
            </div>
            <div class="filter-group">
                <label>📋 보기 방식</label>
                <div class="view-toggle">
                    <button type="button" class="view-btn active" id="cardViewBtn" data-view="card">카드보기</button>
                    <button type="button" class="view-btn" id="overviewViewBtn" data-view="overview">주간 전체보기</button>
                </div>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-icon total">📊</div>
                <div class="stat-text">
                    <span class="stat-label">총 일정</span>
                    <span class="stat-value" id="totalCount">0</span>
                </div>
            </div>
            <div class="stat-item">
                <div class="stat-icon week">📌</div>
                <div class="stat-text">
                    <span class="stat-label">금주 일정</span>
                    <span class="stat-value" id="weekCount">0</span>
                </div>
            </div>
        </div>

        <!-- 주간 전체보기 모드 전용 상단바: 다른 메뉴가 모두 숨겨진 상태에서
             화면으로 돌아가기 / 주차 이동을 담당하는 최소한의 컨트롤 -->
        <div class="overview-topbar" id="overviewTopbar">
            <button type="button" class="ob-exit-btn" id="obExitBtn">✕ 카드보기</button>
            <div class="ob-week-label" id="obWeekLabel">-</div>
            <div class="ob-nav">
                <button type="button" class="ob-nav-btn" id="obPrevBtn">◀ 전주</button>
                <button type="button" class="ob-nav-btn" id="obNextBtn">차주 ▶</button>
            </div>
        </div>

        <div class="content">
            <div class="week-header" id="weekHeader">
                <div class="week-title" id="weekTitle">전체 스케줄</div>
                <div class="week-range" id="weekRange"></div>
            </div>
            <div class="schedule-grid" id="scheduleGrid">
                <div class="no-data">
                    <div class="no-data-icon">📋</div>
                    <div class="no-data-text">데이터를 불러오는 중...</div>
                </div>
            </div>
        </div>
    </div>

    <div class="floating-week-nav" id="floatingWeekNav">
        <button type="button" class="float-nav-btn" id="prevWeekBtn" title="이전 주차로 이동">
            <span class="arrow">▲</span><span>전주</span>
        </button>
        <span class="float-week-label" id="floatingWeekLabel">-</span>
        <button type="button" class="float-nav-btn" id="nextWeekBtn" title="다음 주차로 이동">
            <span class="arrow">▼</span><span>차주</span>
        </button>
    </div>

    <div class="week-toast" id="weekToast"></div>

    <script>
        // 전역 변수
        let allSchedules = [];
        let filteredSchedules = [];
        let viewMode = 'card'; // 'card' = 카드보기, 'overview' = 주간 전체보기(가로)

        // GitHub에서 Excel 파일 자동 로드
        async function loadExcelFromGitHub() {
            try {
                // 캐시 방지를 위한 타임스탬프 추가
                const timestamp = new Date().getTime();
                const response = await fetch(`as_claim_weekly.xlsx?t=${timestamp}`);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const arrayBuffer = await response.arrayBuffer();
                
                if (arrayBuffer.byteLength === 0) {
                    throw new Error('파일이 비어있습니다.');
                }
                
                const data = new Uint8Array(arrayBuffer);
                const workbook = XLSX.read(data, { type: 'array' });
                
                console.log('워크북 시트:', workbook.SheetNames); // 디버깅용
                
                // 첫 번째 시트 읽기 - header: 1로 원본 배열 형태로 읽기
                const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
                const rawData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
                
                console.log('첫 5행 원본 데이터:', rawData.slice(0, 5));
                
                // 헤더 행 찾기 (보통 첫 번째 또는 두 번째 행)
                let headerRowIndex = -1;
                for (let i = 0; i < Math.min(5, rawData.length); i++) {
                    const row = rawData[i];
                    if (row && row.length > 0 && 
                        (row.includes('주') || row.includes('일자') || row.includes('구분'))) {
                        headerRowIndex = i;
                        console.log(`헤더 발견: ${i}번째 행`, row);
                        break;
                    }
                }
                
                if (headerRowIndex === -1) {
                    throw new Error('Excel 파일에서 헤더를 찾을 수 없습니다.');
                }
                
                // 헤더를 기준으로 다시 파싱
                const jsonData = XLSX.utils.sheet_to_json(firstSheet, { 
                    range: headerRowIndex,
                    defval: ''
                });
                
                console.log('파싱된 데이터 샘플:', jsonData[0]);
                console.log('읽은 데이터 개수:', jsonData.length);
                
                if (jsonData.length === 0) {
                    throw new Error('Excel 파일에 데이터가 없습니다.');
                }
                
                // 데이터 변환 및 처리
                processExcelData(jsonData);
                
                console.log(`✅ ${jsonData.length}개의 일정을 불러왔습니다.`);
            } catch (error) {
                console.error('Excel 파일 읽기 오류:', error);
                document.getElementById('scheduleGrid').innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">❌</div>
                        <div class="no-data-text">파일을 불러오는 중 오류가 발생했습니다</div>
                        <div style="margin-top: 10px; font-size: 13px; color: #6c757d;">
                            ${error.message}<br><br>
                            • as_claim_weekly.xlsx 파일이 같은 경로에 있는지 확인해주세요<br>
                            • 브라우저 콘솔(F12)에서 자세한 오류를 확인하세요
                        </div>
                    </div>
                `;
            }
        }

        // 날짜로부터 주차 계산 (YYYY년 N주 형식)
        function getWeekFromDate(dateStr) {
            const date = new Date(dateStr);
            const year = date.getFullYear();
            
            // 해당 연도의 1월 1일
            const yearStart = new Date(year, 0, 1);
            
            // 1월 1일부터 해당 날짜까지의 일수
            const daysDiff = Math.floor((date - yearStart) / (24 * 60 * 60 * 1000));
            
            // 주차 계산 (1월 1일이 속한 주를 1주로)
            const weekNumber = Math.ceil((daysDiff + yearStart.getDay() + 1) / 7);
            
            return `${weekNumber}주`;
        }

        // Excel 데이터 처리 및 변환
        function processExcelData(jsonData) {
            console.log('========== 데이터 처리 시작 ==========');
            console.log('원본 데이터 샘플:', jsonData[0]); // 디버깅용
            console.log('원본 데이터 전체 개수:', jsonData.length);
            
            // 컬럼명 확인
            if (jsonData.length > 0) {
                console.log('Excel 컬럼명 목록:', Object.keys(jsonData[0]));
            }
            
            allSchedules = jsonData.map((item, index) => {
                // Excel 날짜를 JavaScript 날짜로 변환
                let dateStr = item['일자'];
                
                // 첫 5개 항목만 상세 로그
                if (index < 5) {
                    console.log(`[${index}] 원본 일자:`, dateStr, '타입:', typeof dateStr);
                }
                
                if (typeof dateStr === 'number') {
                    // Excel 날짜 시리얼 번호를 날짜로 변환
                    const excelDate = new Date((dateStr - 25569) * 86400 * 1000);
                    const year = excelDate.getFullYear();
                    const month = String(excelDate.getMonth() + 1).padStart(2, '0');
                    const day = String(excelDate.getDate()).padStart(2, '0');
                    dateStr = `${year}-${month}-${day}`;
                    if (index < 5) {
                        console.log(`[${index}] 변환된 날짜:`, dateStr);
                    }
                } else if (dateStr && typeof dateStr === 'string') {
                    // 문자열 날짜 처리
                    if (dateStr.includes('/')) {
                        // "YYYY/MM/DD" 형식을 "YYYY-MM-DD"로 변환
                        dateStr = dateStr.replace(/\//g, '-');
                    } else if (dateStr.includes(' ')) {
                        // "YYYY-MM-DD HH:MM:SS" 형식에서 날짜 부분만 추출
                        dateStr = dateStr.split(' ')[0];
                    }
                    if (index < 5) {
                        console.log(`[${index}] 문자열 날짜:`, dateStr);
                    }
                } else {
                    // 날짜가 없는 경우에도 로그
                    if (index < 5) {
                        console.log(`[${index}] 날짜 없음 - null 처리`);
                    }
                    dateStr = null;
                }

                return {
                    주: dateStr ? getWeekFromDate(dateStr) : '', // 일자 기준으로 주차 자동 계산
                    일자: dateStr,
                    일자_str: dateStr,
                    구분: item['구분'] || '',
                    인도일: item['인도일'] || '',
                    조선소_장소: item['조선소\r\n장소'] || item['조선소/장소'] || '',
                    호선: item['호 선'] || item['호선'] || '',
                    장비: item['장비'] || '',
                    검사종류_고객요청사항: item['검사종류 / 고객요청사항'] || item['검사종류/고객요청사항'] || '',
                    담당자: item['담당자'] || '',
                    외주: item['외주'] || '',
                    유무상: item['유/무상'] || item['유무상'] || '',
                    차량: item['차량'],
                    출장인원: item['출장인원'] || '',
                    비고: item['비고'] || ''
                };
            });
            
            console.log('변환 완료 - 전체 항목:', allSchedules.length);
            
            // 첫 5개 항목의 주차, 유무상, 검사종류 정보 확인
            console.log('주차, 유무상, 검사종류 샘플:');
            allSchedules.slice(0, 5).forEach((s, i) => {
                console.log(`  [${i}] 일자: ${s.일자} → 주차: ${s.주}, 유무상: "${s.유무상}", 검사종류: "${s.검사종류_고객요청사항}"`);
            });
            
            // 필터링: 날짜가 없거나 구분이 빈칸인 항목 제거
            const beforeFilter = allSchedules.length;
            allSchedules = allSchedules.filter(s => {
                // 날짜가 없으면 제외
                if (!s.일자 || s.일자 === null || s.일자 === '') return false;
                // 구분이 빈칸이면 제외
                if (!s.구분 || s.구분 === '') return false;
                return true;
            });
            const afterFilter = allSchedules.length;
            
            console.log(`필터링: ${beforeFilter}개 → ${afterFilter}개 (${beforeFilter - afterFilter}개 제거)`);
            console.log('처리된 데이터 샘플:', allSchedules[0]); // 디버깅용
            console.log('========== 데이터 처리 완료 ==========');

            initializeData();
        }

        // 스케줄 데이터 (기본값 - 빈 배열)
        const scheduleData = [];

        // 날짜 포맷팅 함수
        function formatDate(dateStr) {
            if (!dateStr) return 'Invalid Date';
            
            const date = new Date(dateStr);
            
            // Invalid Date 체크
            if (isNaN(date.getTime())) {
                console.error('잘못된 날짜:', dateStr);
                return 'Invalid Date';
            }
            
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const weekday = weekdays[date.getDay()];
            return `${year}.${month}.${day} (${weekday})`;
        }

        // 필터 초기화 함수
        function clearFilters() {
            const weekFilter = document.getElementById('weekFilter');
            const managerFilter = document.getElementById('managerFilter');
            const vendorFilter = document.getElementById('vendorFilter');

            // 기존 옵션 제거 (첫 번째 기본 옵션 제외)
            while (weekFilter.options.length > 1) weekFilter.remove(1);
            while (managerFilter.options.length > 1) managerFilter.remove(1);
            while (vendorFilter.options.length > 1) vendorFilter.remove(1);
        }

        // 현재 주차 계산 - 오늘 날짜가 속한 주차 반환

        // 17시 이후에는 '오늘' 기준을 익일로 당겨서 계산
        // (퇴근 시간 이후에는 당일 스케줄보다 다음 일정이 더 의미있게 보이도록)
        function getEffectiveToday() {
            const now = new Date();
            const effective = new Date(now);
            effective.setHours(0, 0, 0, 0);

            if (now.getHours() >= 17) {
                effective.setDate(effective.getDate() + 1);
            }

            return effective;
        }

        // 로컬 시간대 기준 YYYY-MM-DD 문자열 생성 (toISOString의 UTC 오차 방지)
        function toLocalDateStr(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getCurrentWeek() {
            const today = getEffectiveToday();
            
            const todayStr = toLocalDateStr(today);
            const currentWeek = getWeekFromDate(todayStr);
            
            console.log('=== 현재 주차 계산 ===');
            console.log('기준 날짜(17시 이후 익일 보정):', todayStr);
            console.log('기준일의 주차:', currentWeek);
            
            // 데이터에 현재 주차가 있는지 확인
            const hasCurrentWeek = allSchedules.some(s => s.주 === currentWeek);
            console.log('데이터에 현재 주차 존재 여부:', hasCurrentWeek);
            
            if (hasCurrentWeek) {
                return currentWeek;
            }
            
            // 현재 주차에 스케줄이 없으면 가장 가까운 미래 주차 찾기
            console.log('현재 주차에 스케줄 없음, 가장 가까운 미래 주차 찾기');
            let closestFutureWeek = null;
            let minDiff = Infinity;
            
            for (let schedule of allSchedules) {
                const scheduleDate = new Date(schedule.일자);
                scheduleDate.setHours(0, 0, 0, 0);
                const diff = scheduleDate - today;
                
                // 오늘 이후의 날짜 중 가장 가까운 것
                if (diff >= 0 && diff < minDiff) {
                    minDiff = diff;
                    closestFutureWeek = schedule.주;
                }
            }
            
            if (closestFutureWeek) {
                console.log('가장 가까운 미래 주차:', closestFutureWeek);
                return closestFutureWeek;
            }
            
            // 미래 스케줄도 없으면 가장 가까운 주차 (과거 포함)
            let closestWeek = null;
            minDiff = Infinity;
            
            for (let schedule of allSchedules) {
                const scheduleDate = new Date(schedule.일자);
                const diff = Math.abs(scheduleDate - today);
                
                if (diff < minDiff) {
                    minDiff = diff;
                    closestWeek = schedule.주;
                }
            }
            
            console.log('가장 가까운 주차(과거 포함):', closestWeek);
            return closestWeek;
        }

        // 데이터에서 주차 목록 추출 (숫자 순 정렬, NaN 등 비정상값 제외)
        function extractWeeks(data) {
            return [...new Set(data.map(s => s.주))]
                .filter(w => w && /^\d+주$/.test(String(w).trim()))
                .sort((a, b) => parseInt(a) - parseInt(b));
        }

        // 데이터에서 담당자 목록 추출
        function extractManagers(data) {
            return [...new Set(data
                .filter(s => s.담당자 && s.담당자 !== 'nan' && typeof s.담당자 === 'string')
                .flatMap(s => s.담당자.split(',').map(m => m.trim()))
            )].sort();
        }

        // 데이터에서 외주 목록 추출
        function extractVendors(data) {
            const vendorsSet = new Set();
            data.forEach(s => {
                if (s.외주 && s.외주 !== 'nan' && typeof s.외주 === 'string') {
                    s.외주.split(',').map(v => v.replace(/\([^)]*\)/g, '').trim().replace(/\n/g, ''))
                        .forEach(v => { if (v && v !== '?' && v !== '외주') vendorsSet.add(v); });
                }
            });
            return [...vendorsSet].sort();
        }

        // 선택값을 유지하면서 select 옵션 업데이트
        function updateSelectOptions(selectEl, items, prevValue) {
            while (selectEl.options.length > 1) selectEl.remove(1);
            items.forEach(item => {
                const opt = document.createElement('option');
                opt.value = item;
                opt.textContent = item;
                selectEl.appendChild(opt);
            });
            selectEl.value = items.includes(prevValue) ? prevValue : '';
        }

        // 3개 필터를 현재 선택 기준으로 연동 갱신
        function updateLinkedFilters() {
            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            const selWeek    = weekEl.value;
            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            // 주차 옵션: manager + vendor 기준 데이터에서 추출
            const forWeek = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            // 담당자 옵션: week + vendor 기준 데이터에서 추출
            const forManager = allSchedules.filter(s => {
                const wOk = !selWeek   || s.주 === selWeek;
                const vOk = !selVendor || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return wOk && vOk;
            });

            // 외주 옵션: week + manager 기준 데이터에서 추출
            const forVendor = allSchedules.filter(s => {
                const wOk = !selWeek    || s.주 === selWeek;
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                return wOk && mOk;
            });

            updateSelectOptions(weekEl,    extractWeeks(forWeek),       selWeek);
            updateSelectOptions(managerEl, extractManagers(forManager), selManager);
            updateSelectOptions(vendorEl,  extractVendors(forVendor),   selVendor);
        }

        // 데이터 초기화
        function initializeData() {
            if (allSchedules.length === 0) return;

            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            // 초기 전체 옵션 세팅
            clearFilters();
            updateWeekFilter();  // 주차 (현재 주차 자동 선택 포함)
            extractManagers(allSchedules).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m; opt.textContent = m;
                managerEl.appendChild(opt);
            });
            extractVendors(allSchedules).forEach(v => {
                const opt = document.createElement('option');
                opt.value = v; opt.textContent = v;
                vendorEl.appendChild(opt);
            });

            // 주차가 기본 선택된 상태에서 연동 갱신 (담당자/외주 목록 좁히기)
            updateLinkedFilters();

            // 필터 이벤트 리스너: 변경 시 연동 갱신 → 렌더링
            [weekEl, managerEl, vendorEl].forEach(el => {
                el.addEventListener('change', () => {
                    updateLinkedFilters();
                    if (viewMode === 'overview') {
                        ensureWeekSelectedForOverview();
                    }
                    applyFilters();
                });
            });

            applyFilters();
        }

        // 연도에 따라 주차 필터 업데이트
        function updateWeekFilter() {
            const weekFilter = document.getElementById('weekFilter');
            
            // 기존 옵션 제거 (첫 번째 "전체 주차" 제외)
            while (weekFilter.options.length > 1) {
                weekFilter.remove(1);
            }
            
            // 주차 목록 추출 및 정렬 (숫자 형식만, 순차 정렬)
            const weeks = [...new Set(allSchedules.map(s => s.주))]
                .filter(w => w && /^\d+주$/.test(String(w).trim()))
                .sort((a, b) => parseInt(a) - parseInt(b));
            
            console.log('=== 주차 필터 업데이트 ===');
            console.log('전체 주차 목록:', weeks);
            
            weeks.forEach(week => {
                const option = document.createElement('option');
                option.value = week;
                option.textContent = week;
                weekFilter.appendChild(option);
            });

            // 현재 주차 설정
            const currentWeek = getCurrentWeek();
            console.log('현재 주차:', currentWeek);
            console.log('주차 목록에 포함 여부:', weeks.includes(currentWeek));
            
            if (currentWeek && weeks.includes(currentWeek)) {
                weekFilter.value = currentWeek;
                console.log('주차 필터 설정 완료:', weekFilter.value);
            } else {
                weekFilter.value = '';
                console.log('주차 필터를 전체로 설정');
            }
        }

        // 필터 적용
        function applyFilters() {
            const weekFilter = document.getElementById('weekFilter').value;
            const managerFilter = document.getElementById('managerFilter').value;
            const vendorFilter = document.getElementById('vendorFilter').value;

            filteredSchedules = allSchedules.filter(schedule => {
                // 주차 필터 (주차가 선택되면 해당 주의 모든 스케줄 표시)
                if (weekFilter && schedule.주 !== weekFilter) return false;

                // 담당자 필터 - 정확한 매칭
                if (managerFilter) {
                    const 담당자 = schedule.담당자;
                    // 담당자가 없거나 NaN인 경우 제외
                    if (!담당자 || 담당자 === 'nan' || typeof 담당자 !== 'string') {
                        return false;
                    }
                    // 쉼표로 구분된 담당자 목록에서 정확히 일치하는지 확인
                    const 담당자목록 = 담당자.split(',').map(m => m.trim());
                    if (!담당자목록.includes(managerFilter)) {
                        return false;
                    }
                }

                // 외주 필터 - 정확한 매칭
                if (vendorFilter) {
                    const 외주 = schedule.외주;
                    // 외주가 없거나 NaN인 경우 제외
                    if (!외주 || 외주 === 'nan' || typeof 외주 !== 'string') {
                        return false;
                    }
                    const cleanVendor = 외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '');
                    if (!cleanVendor.includes(vendorFilter)) {
                        return false;
                    }
                }

                return true;
            });

            renderSchedules();
        }

        // 스케줄 렌더링
        function renderSchedules() {
            const grid = document.getElementById('scheduleGrid');
            const weekFilter = document.getElementById('weekFilter').value;
            
            // 금주 일정 계산 (현재 주차의 일정 수)
            const currentWeek = getCurrentWeek();
            const thisWeekSchedules = allSchedules.filter(s => s.주 === currentWeek);
            
            // 통계 업데이트
            document.getElementById('totalCount').textContent = allSchedules.length;
            document.getElementById('weekCount').textContent = thisWeekSchedules.length;

            // 플로팅 전주/차주 위젯 라벨 갱신
            const floatLabel = document.getElementById('floatingWeekLabel');
            if (floatLabel) {
                floatLabel.textContent = weekFilter || currentWeek || '-';
            }

            // 주차 헤더 업데이트
            if (weekFilter) {
                const weekSchedules = filteredSchedules.filter(s => s.주 === weekFilter);
                if (weekSchedules.length > 0) {
                    const dates = weekSchedules.map(s => new Date(s.일자));
                    const minDate = new Date(Math.min(...dates));
                    const maxDate = new Date(Math.max(...dates));
                    document.getElementById('weekTitle').textContent = `${weekFilter} 스케줄`;
                    document.getElementById('weekRange').textContent = 
                        `${formatDate(minDate.toISOString())} ~ ${formatDate(maxDate.toISOString())}`;
                }
            } else {
                document.getElementById('weekTitle').textContent = '전체 스케줄';
                document.getElementById('weekRange').textContent = '';
            }

            // 주간 전체보기 상단바 라벨 갱신 (예: "35주 · 08.24 (월) ~ 08.28 (금)")
            const obLabel = document.getElementById('obWeekLabel');
            if (obLabel) {
                const wTitle = document.getElementById('weekTitle').textContent;
                const wRange = document.getElementById('weekRange').textContent;
                obLabel.textContent = wRange ? `${wTitle} · ${wRange}` : wTitle;
            }

            if (filteredSchedules.length === 0) {
                grid.innerHTML = `
                    <div class="no-data">
                        <div class="no-data-icon">🔍</div>
                        <div class="no-data-text">조건에 맞는 일정이 없습니다</div>
                    </div>
                `;
                return;
            }

            // 주간 전체보기 모드: 가로형 요일 보드로 렌더링
            if (viewMode === 'overview') {
                grid.innerHTML = renderOverviewBoard(weekFilter);
                return;
            }

            // 날짜별로 그룹화 및 정렬
            const grouped = {};
            filteredSchedules.forEach(schedule => {
                const date = schedule.일자;
                if (!grouped[date]) grouped[date] = [];
                grouped[date].push(schedule);
            });

            const sortedDates = Object.keys(grouped).sort();
            
            grid.innerHTML = sortedDates.map(date => {
                const schedules = grouped[date];
                return schedules.map(schedule => createScheduleCard(schedule, date)).join('');
            }).join('');

            // 렌더링 완료 후 오늘 날짜로 스크롤
            scrollToToday();
        }

        // 주차 선택 없이 주간 전체보기로 전환된 경우, 현재 주차(또는 첫 주차)를 자동 선택
        function ensureWeekSelectedForOverview() {
            const weekEl = document.getElementById('weekFilter');
            if (weekEl.value) return;

            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');
            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            const filteredForWeeks = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            const weeks = extractWeeks(filteredForWeeks);
            if (weeks.length === 0) return;

            const currentWeek = getCurrentWeek();
            weekEl.value = weeks.includes(currentWeek) ? currentWeek : weeks[0];
            updateLinkedFilters();
        }

        // 주간 전체보기: 월~일 7일 가로 보드 생성
        function renderOverviewBoard(weekFilter) {
            if (!weekFilter) {
                return `
                    <div class="no-data">
                        <div class="no-data-icon">📅</div>
                        <div class="no-data-text">전체보기는 특정 주차를 선택했을 때 표시됩니다</div>
                    </div>
                `;
            }

            // 요일 배치는 담당자/외주 필터와 무관하게 그 주에 실제 존재하는 날짜 전체를 기준으로 계산
            // (필터링으로 일부 요일의 일정이 사라져도 요일 칸 자체는 유지되도록)
            const weekAllDates = allSchedules
                .filter(s => s.주 === weekFilter && s.일자)
                .map(s => s.일자)
                .sort();

            if (weekAllDates.length === 0) {
                return `
                    <div class="no-data">
                        <div class="no-data-icon">📋</div>
                        <div class="no-data-text">해당 주차에 일정이 없습니다</div>
                    </div>
                `;
            }

            // 해당 주의 월요일 계산 후 7일(월~일) 생성
            const firstDate = new Date(weekAllDates[0] + 'T00:00:00');
            const dow = firstDate.getDay(); // 0=일 ... 6=토
            const mondayOffset = (dow + 6) % 7;
            const monday = new Date(firstDate);
            monday.setDate(monday.getDate() - mondayOffset);

            const days = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(monday);
                d.setDate(d.getDate() + i);
                days.push(toLocalDateStr(d));
            }

            // 필터(담당자/외주)까지 반영된 스케줄을 날짜별로 그룹화
            const grouped = {};
            filteredSchedules.forEach(schedule => {
                if (!grouped[schedule.일자]) grouped[schedule.일자] = [];
                grouped[schedule.일자].push(schedule);
            });

            const weekdayNames = ['일', '월', '화', '수', '목', '금', '토'];
            const todayStr = toLocalDateStr(getEffectiveToday());

            // 요일별 데이터 구성 (토/일요일은 일정이 없으면 화면에서 제외하여
            // 가시성을 높이고, 평일 칸이 더 넓게 화면을 채우도록 함)
            const dayInfos = days.map(dateStr => {
                const d = new Date(dateStr + 'T00:00:00');
                const weekdayIdx = d.getDay();
                const isWeekend = weekdayIdx === 0 || weekdayIdx === 6;
                const items = grouped[dateStr] || [];
                return { dateStr, d, weekdayIdx, isWeekend, items };
            }).filter(day => !(day.isWeekend && day.items.length === 0));

            const daysHtml = dayInfos.map(({ dateStr, d, weekdayIdx, isWeekend, items }) => {
                const isToday = dateStr === todayStr;

                return `
                    <div class="overview-day ${isToday ? 'today' : ''} ${isWeekend ? 'weekend' : ''}">
                        <div class="overview-day-header">
                            <div>
                                <span class="overview-day-date">${d.getMonth() + 1}/${d.getDate()}</span>
                                <span class="overview-day-weekday">(${weekdayNames[weekdayIdx]})</span>
                            </div>
                            ${items.length > 0 ? `<div class="overview-day-count">${items.length}건</div>` : ''}
                        </div>
                        <div class="overview-day-body">
                            ${items.length === 0
                                ? '<div class="overview-empty">일정 없음</div>'
                                : items.map(item => createOverviewItem(item)).join('')}
                        </div>
                    </div>
                `;
            }).join('');

            return `<div class="overview-board">${daysHtml}</div>`;
        }

        // 주간 전체보기용 압축 카드 (외주 정보 강조)
        function createOverviewItem(schedule) {
            const 구분Value = schedule.구분 ? String(schedule.구분).trim() : '';
            let itemClass = '';
            let 구분Badge = '';
            if (구분Value === 'A/S') {
                구분Badge = '<span class="badge as">A/S</span>';
            } else if (구분Value === 'CLAIM' || 구분Value === '클레임') {
                구분Badge = '<span class="badge claim">CLAIM</span>';
                itemClass = 'claim';
            } else if (구분Value === '사내') {
                구분Badge = '<span class="badge naeso">사내</span>';
                itemClass = 'naeso';
            } else if (구분Value && 구분Value !== 'nan') {
                구분Badge = `<span class="badge default">${구분Value}</span>`;
            }

            let 유무상Badge = '';
            const 유무상Value = schedule.유무상;
            if (유무상Value) {
                const 유무상Str = String(유무상Value).trim();
                if (유무상Str.includes('무상')) {
                    유무상Badge = '<span class="badge free">무상</span>';
                } else if (유무상Str.includes('유상')) {
                    유무상Badge = '<span class="badge paid">유상</span>';
                }
            }

            const 외주텍스트 = (schedule.외주 && schedule.외주 !== 'nan')
                ? String(schedule.외주).replace(/\n/g, ' ').trim()
                : '';

            return `
                <div class="overview-item ${itemClass}">
                    <div class="overview-item-top">
                        ${구분Badge}${유무상Badge}
                    </div>
                    ${schedule.조선소_장소 ? `<div class="overview-item-place">${schedule.조선소_장소}</div>` : ''}
                    <div class="overview-item-sub">${[schedule.호선, schedule.장비].filter(Boolean).join(' · ')}</div>
                    ${외주텍스트 ? `<div class="overview-vendor">🏭 ${외주텍스트}</div>` : ''}
                    ${schedule.담당자 && schedule.담당자 !== 'nan' ? `<div class="overview-item-manager">👤 ${schedule.담당자}</div>` : ''}
                </div>
            `;
        }

        // 오늘 날짜 카드로 자동 스크롤
        function scrollToToday() {
            // 약간의 지연을 주어 DOM이 완전히 렌더링된 후 스크롤
            setTimeout(() => {
                const today = getEffectiveToday();
                
                // 로컬 시간대를 사용한 날짜 문자열 생성 (YYYY-MM-DD)
                const year = today.getFullYear();
                const month = String(today.getMonth() + 1).padStart(2, '0');
                const day = String(today.getDate()).padStart(2, '0');
                const todayStr = `${year}-${month}-${day}`;
                
                console.log('=== 자동 스크롤 시작 ===');
                console.log('기준 날짜(17시 이후 익일 보정):', todayStr);
                
                // 모든 카드 가져오기
                const allCards = document.querySelectorAll('.schedule-card[data-date]');
                
                if (allCards.length === 0) {
                    console.log('카드가 없습니다.');
                    return;
                }
                
                // 1. 오늘 날짜 카드 먼저 찾기
                let targetCard = document.querySelector(`[data-date="${todayStr}"]`);
                
                if (targetCard) {
                    console.log('오늘 날짜 카드 발견');
                } else {
                    console.log('오늘 날짜 카드 없음, 가장 가까운 미래 날짜 찾기');
                    
                    // 2. 가장 가까운 미래 날짜 찾기 (내일, 모레...)
                    let closestFutureCard = null;
                    let minDiff = Infinity;
                    
                    allCards.forEach(card => {
                        const cardDateStr = card.getAttribute('data-date');
                        const cardDate = new Date(cardDateStr + 'T00:00:00');
                        const diff = cardDate - today; // 미래는 양수
                        
                        // 오늘 이후의 날짜 중 가장 가까운 것
                        if (diff > 0 && diff < minDiff) {
                            minDiff = diff;
                            closestFutureCard = card;
                        }
                    });
                    
                    if (closestFutureCard) {
                        targetCard = closestFutureCard;
                        const futureDate = targetCard.getAttribute('data-date');
                        console.log('가장 가까운 미래 날짜:', futureDate);
                    } else {
                        // 3. 미래 일정도 없으면 가장 가까운 과거 날짜
                        console.log('미래 일정 없음, 가장 가까운 과거 날짜 찾기');
                        let closestPastCard = null;
                        minDiff = Infinity;
                        
                        allCards.forEach(card => {
                            const cardDateStr = card.getAttribute('data-date');
                            const cardDate = new Date(cardDateStr + 'T00:00:00');
                            const diff = today - cardDate;
                            
                            // 오늘 이전의 날짜 중 가장 가까운 것
                            if (diff > 0 && diff < minDiff) {
                                minDiff = diff;
                                closestPastCard = card;
                            }
                        });
                        
                        targetCard = closestPastCard || allCards[0];
                        
                        if (targetCard) {
                            const pastDate = targetCard.getAttribute('data-date');
                            console.log('가장 가까운 과거 날짜:', pastDate);
                        }
                    }
                }
                
                if (targetCard) {
                    console.log('스크롤 대상:', targetCard.getAttribute('data-date'));
                    
                    // 부드러운 스크롤
                    targetCard.scrollIntoView({ 
                        behavior: 'smooth', 
                        block: 'start'
                    });
                    
                    // 카드 강조 효과
                    targetCard.style.animation = 'highlight 2s ease-in-out';
                }
            }, 500);
        }

        // 스케줄 카드 생성
        function createScheduleCard(schedule, date) {
            const 구분Value = schedule.구분 ? String(schedule.구분).trim() : '';
            let 구분Badge = '';
            if (구분Value === 'A/S') {
                구분Badge = '<span class="badge as">A/S</span>';
            } else if (구분Value === 'CLAIM' || 구분Value === '클레임') {
                구분Badge = '<span class="badge claim">CLAIM</span>';
            } else if (구분Value === '사내') {
                구분Badge = '<span class="badge naeso">사내</span>';
            } else if (구분Value && 구분Value !== 'nan') {
                구분Badge = `<span class="badge default">${구분Value}</span>`;
            }
            
            // 유무상 정보 처리 (다양한 형식 지원)
            let 유무상Badge = '';
            const 유무상Value = schedule.유무상;
            
            if (유무상Value) {
                const 유무상Str = String(유무상Value).trim();
                if (유무상Str.includes('무상') || 유무상Str === '무상') {
                    유무상Badge = '<span class="badge free">무상</span>';
                } else if (유무상Str.includes('유상') || 유무상Str === '유상') {
                    유무상Badge = '<span class="badge paid">유상</span>';
                }
            }

            return `
                <div class="schedule-card" data-date="${date}">
                    <div class="card-header">
                        <div class="card-date">
                            <div class="date-main">${formatDate(schedule.일자)}</div>
                            <div class="date-week">${schedule.주}</div>
                        </div>
                        <div class="card-badges">
                            ${구분Badge}
                            ${유무상Badge}
                        </div>
                    </div>
                    <div class="card-body">
                        ${schedule.조선소_장소 ? `
                        <div class="info-row">
                            <div class="info-label">조선소(장소)</div>
                            <div class="info-value highlight">${schedule.조선소_장소}</div>
                        </div>` : ''}
                        
                        ${schedule.장비 ? `
                        <div class="info-row">
                            <div class="info-label">장비</div>
                            <div class="info-value">${schedule.장비}</div>
                        </div>` : ''}
                        
                        ${schedule.호선 ? `
                        <div class="info-row">
                            <div class="info-label">호선</div>
                            <div class="info-value">${schedule.호선}</div>
                        </div>` : ''}
                        
                        ${schedule.검사종류_고객요청사항 ? `
                        <div class="info-row">
                            <div class="info-label">검사종류(고객요청사항)</div>
                            <div class="info-value">${schedule.검사종류_고객요청사항}</div>
                        </div>` : ''}
                        
                        ${schedule.담당자 && schedule.담당자 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">담당자</div>
                            <div class="info-value highlight">${schedule.담당자}</div>
                        </div>` : ''}
                        
                        ${schedule.외주 && schedule.외주 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">외주</div>
                            <div class="info-value">${schedule.외주}</div>
                        </div>` : ''}
                        
                        ${schedule.차량 && schedule.차량 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">차량</div>
                            <div class="info-value">${schedule.차량}</div>
                        </div>` : ''}
                        
                        ${schedule.출장인원 ? `
                        <div class="info-row">
                            <div class="info-label">출장인원</div>
                            <div class="info-value">${schedule.출장인원}명</div>
                        </div>` : ''}
                        
                        ${schedule.비고 && schedule.비고 !== 'nan' ? `
                        <div class="info-row">
                            <div class="info-label">비고</div>
                            <div class="info-value">${schedule.비고.replace(/\n/g, '<br>')}</div>
                        </div>` : ''}
                    </div>
                </div>
            `;
        }

        // 전주(◀) / 차주(▶) 이동
        // 주차 선택이 비어있으면(전체 주차) 현재 기준 주차에서 출발
        // 화면 하단에 짧게 알림 문구를 띄우는 토스트
        let toastTimer = null;
        function showToast(message) {
            const toastEl = document.getElementById('weekToast');
            if (!toastEl) return;

            toastEl.textContent = message;
            toastEl.classList.add('show');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toastEl.classList.remove('show');
            }, 2200);
        }

        function shiftWeek(direction) {
            const weekEl    = document.getElementById('weekFilter');
            const managerEl = document.getElementById('managerFilter');
            const vendorEl  = document.getElementById('vendorFilter');

            const selManager = managerEl.value;
            const selVendor  = vendorEl.value;

            // 현재 선택된 담당자/외주 필터를 반영한 데이터에서만 주차를 추출
            // (전체 데이터 기준으로 주차를 뽑으면, 해당 담당자/외주 일정이 없는 주차로
            //  이동하게 되고, 이후 updateLinkedFilters()에서 "선택값이 옵션에 없음"으로
            //  판단되어 담당자/외주/주차 필터가 모두 초기화되는 버그가 발생함)
            const filteredForWeeks = allSchedules.filter(s => {
                const mOk = !selManager || (s.담당자 && typeof s.담당자 === 'string' &&
                    s.담당자.split(',').map(m => m.trim()).includes(selManager));
                const vOk = !selVendor  || (s.외주 && typeof s.외주 === 'string' &&
                    s.외주.replace(/\([^)]*\)/g, '').replace(/\n/g, '').includes(selVendor));
                return mOk && vOk;
            });

            const weeks = extractWeeks(filteredForWeeks);
            if (weeks.length === 0) {
                showToast('선택한 조건에 해당하는 일정이 없습니다.');
                return;
            }

            const currentVal = weekEl.value;

            let idx = currentVal ? weeks.indexOf(currentVal) : -1;

            if (idx === -1) {
                // 전체 주차 상태 → 현재(기준) 주차를 출발점으로 사용
                const baseWeek = getCurrentWeek();
                const baseIdx = weeks.indexOf(baseWeek);
                idx = baseIdx === -1 ? (direction > 0 ? -1 : weeks.length) : baseIdx;
            }

            const rawNewIdx = idx + direction;
            const newIdx = Math.max(0, Math.min(weeks.length - 1, rawNewIdx));

            // 필터(담당자/외주) 적용 기준으로 더 이상 이동할 주차가 없는 경우 안내
            if (rawNewIdx !== newIdx) {
                const filterLabel = [selManager, selVendor].filter(Boolean).join(' / ');
                const suffix = filterLabel ? ` (${filterLabel} 기준)` : '';
                const message = direction > 0
                    ? `다음 일정이 없습니다.${suffix}`
                    : `이전 일정이 없습니다.${suffix}`;
                showToast(message);
            }

            weekEl.value = weeks[newIdx];
            updateLinkedFilters();
            applyFilters();
        }

        document.getElementById('prevWeekBtn').addEventListener('click', () => shiftWeek(-1));
        document.getElementById('nextWeekBtn').addEventListener('click', () => shiftWeek(1));

        // 주간 전체보기 진입/이탈 시 body에 클래스를 토글하여
        // 헤더/필터/통계 등 나머지 메뉴를 숨기고 일정 보드가 화면을 꽉 채우게 함
        function setOverviewFullscreen(active) {
            document.body.classList.toggle('overview-fullscreen', active);
        }

        function setActiveViewButton(mode) {
            document.querySelectorAll('.view-btn').forEach(b => {
                b.classList.toggle('active', b.dataset.view === mode);
            });
        }

        // 카드보기 / 주간 전체보기 전환
        document.querySelectorAll('.view-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) return;

                viewMode = btn.dataset.view;
                setActiveViewButton(viewMode);
                setOverviewFullscreen(viewMode === 'overview');

                if (viewMode === 'overview') {
                    ensureWeekSelectedForOverview();
                }

                applyFilters();
            });
        });

        // 전체보기 상단바: 카드보기로 복귀
        document.getElementById('obExitBtn').addEventListener('click', () => {
            viewMode = 'card';
            setActiveViewButton('card');
            setOverviewFullscreen(false);
            applyFilters();
        });

        // 전체보기 상단바: 전주/차주 이동 (기존 shiftWeek 재사용)
        document.getElementById('obPrevBtn').addEventListener('click', () => shiftWeek(-1));
        document.getElementById('obNextBtn').addEventListener('click', () => shiftWeek(1));

        // 초기화 - 페이지 로딩 시 자동으로 GitHub에서 파일 로드
        window.addEventListener('DOMContentLoaded', function() {
            document.getElementById('scheduleGrid').innerHTML = `
                <div class="no-data">
                    <div class="no-data-icon">⏳</div>
                    <div class="no-data-text">데이터를 불러오는 중...</div>
                </div>
            `;
            loadExcelFromGitHub();
        });
    </script>
</body>
</html>
